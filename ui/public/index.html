<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garbanzo Books — Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Garbanzo<span>Books</span> <em>Studio</em></div>
  <div class="actions">
    <button class="btn ghost toggle" id="btn-kids" title="Kids mode — one question at a time, big buttons, talk &amp; listen" aria-pressed="false">🧒 Kids mode</button>
    <button class="btn ghost toggle" id="btn-tts" title="Read the studio's replies aloud" aria-pressed="false">🔊 Read aloud</button>
    <button class="btn ghost" id="btn-validate" title="Run QA on all books">✓ Validate</button>
    <button class="btn ghost" id="btn-quality" title="Grade books against the 7-gate quality checklist">★ Quality</button>
    <button class="btn ghost" id="btn-build" title="Rebuild the published site">⚙ Build site</button>
    <span class="status" id="conn"></span>
  </div>
</header>

<main class="layout">
  <!-- Left: the studio chat console -->
  <section class="console">
    <div class="console-head">
      <h2>Studio console</h2>
      <p>Pick a guided form below — fill the blanks and the studio does the rest. Prefer to type? Use the box at the bottom anytime.</p>
      <div class="quick" id="form-launchers">
        <button class="chip-btn" data-form="book">✨ New book</button>
        <button class="chip-btn" data-form="world">🌍 New world</button>
        <button class="chip-btn" data-form="character">🧸 New character</button>
        <button class="chip-btn" data-form="story">📖 New story</button>
      </div>
    </div>

    <!-- Guided form panel (populated by app.js) -->
    <div class="formwrap hidden" id="formwrap">
      <div class="form-head">
        <strong id="form-title">Form</strong>
        <button class="iconbtn" id="form-close" title="Close form">✕</button>
      </div>
      <form id="guided-form" class="guided"></form>
    </div>

    <div class="messages" id="messages"></div>

    <!-- Live activity / progress strip -->
    <div class="activity hidden" id="activity">
      <span class="dot"></span>
      <span id="activity-text">Working…</span>
      <span class="elapsed" id="activity-elapsed"></span>
    </div>

    <!-- Quick replies (confirmations) -->
    <div class="quickreplies hidden" id="quickreplies"></div>

    <form class="composer" id="composer">
      <div class="composer-input">
        <textarea id="prompt" rows="2" placeholder="Type anything — e.g. 'a book for ages 7-9 about a robot who plants a moon garden'…"></textarea>
        <button class="micbtn" id="mic" type="button" title="Speak your message" aria-label="Speak your message">🎤</button>
      </div>
      <div class="composer-row">
        <div class="composer-left">
          <label class="modelpick" title="MiniMax is fast & reliable; DeepSeek is more creative — great for stories">
            <span>Model</span>
            <select id="model-select"></select>
          </label>
          <label class="newsess"><input type="checkbox" id="newsess"> new session</label>
        </div>
        <div class="composer-send">
          <button class="btn stopbtn hidden" id="stop" type="button" title="Stop the current step so you can redirect">⏹ Stop</button>
          <button class="btn" id="send" type="submit">Send ▸</button>
        </div>
      </div>
    </form>
  </section>

  <!-- Right: library + live preview -->
  <section class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="library">Library</button>
      <button class="tab" data-tab="preview">Preview</button>
    </div>
    <div class="tabview" id="view-library">
      <button class="btn ghost small" id="btn-refresh">↻ Refresh</button>
      <div id="library"></div>
    </div>
    <div class="tabview hidden" id="view-preview">
      <div class="preview-bar">
        <span>Live site preview</span>
        <a class="btn ghost small" id="open-preview" href="/preview/index.html" target="_blank">Open ↗</a>
      </div>
      <iframe id="preview" src="/preview/index.html" title="site preview"></iframe>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
