[project]
name = "garbanzo-books"
version = "1.0.0"
description = "An AI studio for interactive children's storybooks — worlds, characters, age-leveled stories, consistent illustrations, and a GitHub Pages reader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
# Local FLUX.2 [klein] image-generation backend (CPU-friendly, no API key).
# Install with: uv sync --extra flux   (or: pip install ".[flux]")
flux = [
    "diffusers>=0.36",
    "transformers>=4.46",
    "accelerate>=1.0",
    "huggingface-hub>=0.30",
    "safetensors>=0.4",
    "torch>=2.5",
]

[dependency-groups]
# Dev tooling (installed by `uv sync`, excluded with `uv sync --no-dev`).
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "httpx-sse>=0.4",
    "types-PyYAML>=6.0",
]
# The dynamic studio UI (FastAPI backend). Install with `uv sync --group ui`.
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "httpx-sse>=0.4",
]
# Local FLUX.2 [klein] backend. Install with `uv sync --group flux`.
flux = [
    "diffusers>=0.36",
    "transformers>=4.46",
    "accelerate>=1.0",
    "huggingface-hub>=0.30",
    "safetensors>=0.4",
    "torch>=2.5",
]
# Local TTS/STT stack used by the read-aloud experiments. CPU-only.
# Install with `uv sync --group tts`.
tts = [
    "torch>=2.5",         # CPU wheels are fine; we have no NVIDIA GPU.
    "kokoro>=0.9.4",      # TTS — 82M params, multiple voices incl. emotion-tagged
    "soundfile>=0.12",    # write .wav
    "numpy>=1.26",
    "faster-whisper>=1.0",# STT — CTranslate2 build of distil-whisper-large-v3
    "scipy>=1.11",        # used for reading/inspecting audio
    "huggingface-hub>=0.30",
]

[tool.uv]
# This is a tool workspace, not a distributable library — don't try to build/install it,
# just resolve its dependencies into .venv. Run everything with `uv run python scripts/...`.
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
# Pragmatic typing: check what's annotated (catches real type bugs, enables IDE help)
# without demanding exhaustive annotations across every CLI script. The shared core in
# scripts/lib is the highest-value surface and is fully typed.
python_version = "3.10"
files = ["scripts"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# The studio UI and image-provider HTTP plumbing lean on optional/3rd-party deps that
# aren't worth fully typing here; don't let their absence block the type gate.
module = ["uvicorn.*", "fastapi.*", "PIL.*", "kokoro.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
