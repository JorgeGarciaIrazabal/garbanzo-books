  <text x="48" y="170" font-family="monospace" font-size="18" fill="#3a352f"><tspan x="48" dy="0">A Grumblebeast — large, clumsy, round creature with wobbling</tspan><tspan x="48" dy="26">legs, shaggy fur in dusk-lavender, too many blunt teeth in a</tspan><tspan x="48" dy="26">goofy grin, glowing eyes. Not scary, just dangerous and hungry.</tspan><tspan x="48" dy="26">Sniffing air, turning toward Practice Meadow where a dummy glows</tspan><tspan x="48" dy="26">with residual magic. Village rooftops in background. dreamy</tspan><tspan x="48" dy="26">pastel children&#x27;s book illustration, soft blush and mint</tspan><tspan x="48" dy="26">palette, whisper-thin rounded lines, golden-hour glow with</tspan><tspan x="48" dy="26">floating magic motes, ethereal gradients, hand-painted paper</tspan><tspan x="48" dy="26">texture, cozy whimsical mood, no text. palette: cream #fdf6e3,</tspan><tspan x="48" dy="26">blush-pink #f4c2c2, mint-green #a8e6cf, lavender #c7b8ea,</tspan><tspan x="48" dy="26">golden-hour #ffd93d, dusk-lavender #6b5b95. leave the lower</tspan><tspan x="48" dy="26">third as calm, low-detail negative space for caption text; keep</tspan><tspan x="48" dy="26">characters clear of that zone.</tspan></text>
