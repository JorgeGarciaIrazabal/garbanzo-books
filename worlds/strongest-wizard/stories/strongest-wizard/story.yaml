spine:
  once_upon_a_time: Aria wanted to be the strongest wizard in the world — not for trophies, but so no monster could ever hurt her friends.
  every_day: She practiced in Practice Meadow until sunset. She copied spells from the Great Oak Library's floating books. She dueled Sylfie (and lost). She fizzled fire into flowers, froze her own boots, and levitated Bram's scarf instead of the target. Bram counted on fingers. Sylfie twirled her wand and nailed it first try. Aria just kept going.
  until_one_day: A ward stone at Whisper Village's edge flickered and died. A clumsy, hungry Grumblebeast — all wobbling legs and too many teeth — lumbered through the gap, sniffing for magic.
  because_of_that:
  - The village wizards rushed to recharge the ward, but the ritual takes time. The Grumblebeast spotted Aria's glowing practice dummy and charged.
  - Sylfie's perfect shield spell bounced off its hide. Bram's calculated freeze ray missed. Aria stood between the monster and her friends, heart hammering.
  until_finally: Aria didn't cast a perfect spell. She mashed together every failed attempt — fire+flowers, ice+levitation, light+ink — into a chaotic, sparkling, silly-looking burst that tangled the Grumblebeast in glowing vines, lifted it gently, and deposited it back in the Wild Woods with a confused hiccup.
  ever_since_then: 'Aria still isn''t the ''best'' wizard. Her spells still fizzle. But the Grumblebeast visits for snacks sometimes, the ward stones glow brighter when she''s near, and her friends know: if trouble comes, Aria''s messy magic will be ready.'
