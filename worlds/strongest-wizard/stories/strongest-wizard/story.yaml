slug: strongest-wizard
world: strongest-wizard
title: The Strongest Wizard
logline: Aria practices messy spells every day to become the strongest wizard and protect her friends — when a monster breaches the village wards, her chaotic training becomes their only hope.
summary: Aria isn't the best wizard. Her spells fizzle, backfire, and turn practice dummies into flower bushes. But she practices harder than anyone — copying spells from books, watching duels, drilling with Bram and Sylfie until her fingers are stained and her robe is singed. When a ward stone fails and a bumbling but dangerous monster stumbles into Whisper Village, Aria's 'messy' magic — the weird combinations only she would think to try — saves the day. She learns the strongest wizard isn't the one with the perfect spells, but the one who never stops trying.
