slug: fluffy-spell
world: strongest-wizard
title: The Fluffy Spell
logline: Aria tries Sylfie's fox-change spell, gets stuck half-fluffy, and learns the only way out is
  to let a friend help her through it.
summary: Aria wants to learn the fox-change spell to impress Sylfie and feel like a real wizard. But the
  spell goes fluffy-wrong — fox ears, a bushy tail, whiskers — and Aria can't undo it. Sylfie finds her,
  laughs, then stays to teach the spell step by step until it clicks, together.
