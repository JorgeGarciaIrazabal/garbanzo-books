  stage: partner
spine:
  once_upon_a_time: Aria wanted to learn the fox-change spell, the one Sylfie could pop in a blink.
  every_day: Aria watched Sylfie turn into a red fox and back, fast as a snap.
  until_one_day: Aria said the spell by herself — and turned into a half-fox, half-Aria fluffy mess.
  because_of_that:
  - Aria hid her tail and tried to fix it alone, but it got worse — whiskers, then paws.
  - Sylfie found her, laughed, then sat down to teach the spell one step at a time.
  - Each try flopped funnier — Aria barked, grew a second tail, and turned her nose black.
  until_finally: Aria asked Sylfie to cast it with her, together — and the spell clicked at last.
  ever_since_then: Aria popped back to herself, fur all gone — but kept one soft fox ear a minute longer,
    and they laughed.
