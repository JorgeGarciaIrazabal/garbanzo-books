spine:
  once_upon_a_time: Aria found a teleport spell in the library's restricted shelf — it promised to let
    a wizard blink anywhere they could see. The catch? It only worked for three feet. Sometimes two. Once,
    negative one.
  every_day: 'She drilled it in Practice Meadow: blink to the dummy, blink to the oak, blink to Bram''s
    sandwich (he noticed). Most attempts landed her in a thorn bush, upside down in a tree, or knee-deep
    in the creek. Sylfie mastered it in an afternoon. Aria just kept blinking.'
  until_one_day: A cold whisper echoed from the village center — the ancient Ward Monolith, the source
    of every ward stone. Voidstalker, a tall shadow-monster with white pinprick eyes, had its claws in
    the monolith's core, unraveling the magic thread by thread. The ward stones across Whisper Village
    flickered. The Wild Woods pressed close.
  because_of_that:
  - Adult wizards rushed the monolith, but Voidstalker didn't fight — it *blinked*. Shadow-teleporting
    behind them, beside them, above them. Their spells hit empty air. The monolith groaned, another ward
    stone died.
  - Aria, Bram, and Sylfie watched from the meadow. Sylfie's perfect long-range teleports couldn't track
    Voidstalker's shadow-steps. Bram's calculations dissolved into static. Aria's clumsy three-foot blink?
    It worked on the *same logic*.
  until_finally: 'Aria didn''t blink away. She blinked *through* — behind Voidstalker, inside its guard,
    her wand tapping the monolith''s core and flooding it with raw, messy, practiced magic. The shadow
    monster shrieked, cracked, and fled into the darkness — but not before hissing: "Tick. Tock. We''re
    not done."'
  ever_since_then: 'Aria''s teleport still lands her in bushes. But now she knows: the strongest spell
    isn''t the one that goes farthest. It''s the one that puts you exactly where the monster doesn''t
    expect you.'
