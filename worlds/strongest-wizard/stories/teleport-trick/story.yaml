slug: teleport-trick
world: strongest-wizard
title: The Teleport Trick
logline: Aria masters a finicky teleport spell just in time to out-blink a shadow monster dismantling
  the village's ward monolith — but the monster escapes, swearing revenge.
summary: 'Aria''s new teleport spell only moves her a few feet at a time — into bushes, up trees, once
  into Bram''s soup. But when the cunning Voidstalker appears at the ancient Ward Monolith and starts
  unraveling the village''s defenses, Aria''s clumsy short-range blinks become the only thing fast enough
  to catch a monster that walks through shadows. She out-maneuvers it, drives it off, but it vanishes
  with a promise: "I have all the time in the world."'
