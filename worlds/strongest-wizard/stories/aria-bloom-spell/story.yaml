spine:
  once_upon_a_time: Aria was a young wizard who loved a good spell — and the Bloom Spell looked like the
    best spell of all.
  every_day: She copied the words exactly, waved, and hoped — but every single cast fizzled into a plain
    little cabbage.
  until_one_day: 'Bram burst in with news: the legendary Bloom Sage — the wizard who made a whole mountain
    bloom in one night — was coming to Whisper Village for the flower fair.'
  because_of_that:
  - Aria raced all over town to find the great Sage and ask for the trick — while a tiny grandma on a
    giant snail trailed behind her, watering her boots and mumbling riddles.
  - Aria practiced harder and harder at the fair, copying the book word for word — until one giant fizzle
    flooded the whole fair with hundreds of cabbages.
  - Red-faced in the cabbage flood, Aria finally looked at the little grandma — and the blossom-cloud
    hair, the rainbow watering can, and the nap told her the truth.
  until_finally: Aria stopped copying. She added her own hop, her own hum, and a wish for the seeds —
    and the entire meadow bloomed in a whoosh of rainbow light.
  ever_since_then: Aria wrote the spell in her own little book — in her own words — while the Sage napped
    on a cabbage and called it her favorite.
