- number: 7
  kind: story
  text: The next day Aria walked right up to Sylfie. "Ice fight! Tonight!" Sylfie's eyebrows went up.
    "You. Want to fight. Me?" "I want you to SEE me." Sylfie blinked. Then she grinned — a real grin.
    "You're on, puddle-girl." Bram covered his eyes. Chillworth poured more tea.
