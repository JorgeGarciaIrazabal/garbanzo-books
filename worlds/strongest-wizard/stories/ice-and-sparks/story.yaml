- number: 6
  kind: story
  text: Sylfie passed by and snorted. "Nose-balancing? That's not magic — that's a clown game." Aria stood
    up straight, ice cube wobbling. "It IS magic, Sylfie. It's magic that took me twelve tries!" Sylfie
    stopped walking. Her smile flickered. "...Whatever, puddle-girl." But she walked slower after that.
