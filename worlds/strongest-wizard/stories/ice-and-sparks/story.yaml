- number: 1
  kind: story
  text: 'Aria found a spellbook in the Great Oak Library. It was so cold it stuck to her fingers! The
    pages crackled with frost. The cover said: ICE MAGIC. "I''m learning this," she said. She pushed the
    book into her bag before anyone could say stop.'
