spine:
  once_upon_a_time: Aria finds a frost spellbook so cold it sticks to her hands.
  every_day: Every ice spell she casts melts into a puddle. Bram brings her blankets. She will not stop.
  until_one_day: Sylfie freezes the whole meadow without trying. A strange round wizard called Professor
    Chillworth comes and sees something good in Aria's melted mess.
  because_of_that:
  - 'Professor Chillworth gives Aria his odd ice tasks: put an ice cube on your nose, freeze a daisy without
    crushing it, slide down a hill yelling ''Brrr-illiant!'''
  - Aria asks Sylfie for an ice fight at sunset. Sylfie grins and says yes.
  - In the fight, Aria makes a big ice dragon — her best yet. But Sylfie freezes a whole castle with tiny
    flags, then a wind scoops Aria into a snow pile.
  - 'Sylfie, instead of bragging, runs over amazed: ''That dragon was so good. Teach me how you work so
    hard?'''
  - A frostling comes in — a ward stone is cracking. The two rivals mix their ice magic and fix it together.
  until_finally: 'Aria and Sylfie train side by side. Sylfie calls Aria her real rival — and Chillworth''s
    teapot whistles about their next lesson: lightning.'
  ever_since_then: Aria falls asleep with a smile, frost shapes on her window, a drawing of her and Sylfie
    with the word RIVALS in her spellbook.
