slug: ice-and-sparks
world: strongest-wizard
title: Ice and Sparks
logline: Aria tries to learn ice magic, keeps melting into puddles — until a peculiar penguin-shaped teacher
  shows her that cold magic comes from warm practice, and Sylfie discovers a real rival.
summary: Aria finds a frosty grimoire and is determined to master ice magic, but every spell turns to
  slush. Sylfie freezes things without blinking. When a squat, riddling wizard named Professor Chillworth
  waddles into the meadow, Aria learns that ice isn't about being cold — it's about heart. She challenges
  Sylfie to an ice duel, loses spectacularly, but wins Sylfie's respect. Together they reseal a cracking
  ward stone, and Sylfie finally calls Aria her real rival.
