- number: 8
  kind: story
  text: The sun set and the meadow glowed orange. Aria closed her eyes and remembered. Nose-balancing.
    The daisy that sparkled on try twelve. She snapped her fingers. A DRAGON rose from the frost with
    shiny ice wings. Cold fire curled from its mouth. The crowd gasped! Sylfie's eyes went wide. Then
    she smiled. "Not bad."
