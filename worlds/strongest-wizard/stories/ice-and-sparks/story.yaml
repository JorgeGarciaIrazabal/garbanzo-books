- number: 11
  kind: story
  text: 'They started training together. Sylfie showed Aria how to snap ice into sharp points. Aria showed
    Sylfie the hard part. You practice until your arms hurt. You keep going until your hair is white with
    frost. Bram kept score. Chillworth poured tea and said: "Two warm hearts make the coldest ice." Sylfie
    rolled her eyes. But she stayed and smiled.'
