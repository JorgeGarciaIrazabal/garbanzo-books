spine:
  once_upon_a_time: Aria finds a frost grimoire so cold it sticks to her fingers.
  every_day: Every ice spell she casts melts into a puddle. Bram brings her blankets; she shivers but
    won't quit.
  until_one_day: Sylfie freezes the whole meadow without trying. A strange waddling wizard called Professor
    Chillworth appears and sees something special in Aria's melted mess.
  because_of_that:
  - 'Professor Chillworth teaches Aria his bizarre ice lessons: balance ice on your nose, freeze a flower
    without crushing it, slide down a hill shouting ''Brrr-illiant!'''
  - Aria challenges Sylfie to an ice duel at sunset. Sylfie smirks and accepts.
  - In the duel, Aria conjures a perfect ice dragon — her best ever. But Sylfie freezes an entire castle
    with tiny waving flags, then a tornado scoops Aria into a snowbank.
  - 'Sylfie, instead of gloating, runs over amazed: ''That dragon was incredible. Teach me how you practice
    like that?'''
  - A frostling bursts in — a ward stone is cracking. The two rivals combine their ice magic and seal
    it together.
  until_finally: 'Aria and Sylfie train side by side. Sylfie calls Aria her real rival — and Chillworth''s
    teapot whistles about their next lesson: lightning.'
  ever_since_then: Aria falls asleep smiling, frost patterns on her window, a drawing of her and Sylfie
    labeled 'RIVALS' in her spellbook.
