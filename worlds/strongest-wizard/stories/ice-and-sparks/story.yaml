    scrim: true
- number: 2
  kind: story
  text: Aria practiced all week. She tried to freeze a cup. Puddle. She tried to frost a flower. Slush.
    Every spell turned into a wet spot on the grass. Bram brought her three blankets. "You're shivering."
    "Not quitting," Aria said. Her teeth chattered. Her hair was icy. She pointed at the next cup anyway.
  image:
    prompt: Practice Meadow at dusk, Aria standing in a circle of melted puddles and sad slush patches,
      shivering with chattering teeth, wrapped in layered blankets, Bram beside her holding a sandwich
      with a worried expression, frosty breath barely visible
    characters_present:
    - aria
    - bram
    alt: Aria shivers in a meadow full of melted puddles while Bram brings her blankets
    text_zone: lower third
  layout:
    text_position: lower-third
    text_align: center
    scrim: true
- number: 3
  kind: story
  text: Then Sylfie skipped into the meadow. "What's all this wet mess?" She waved her wand — and the
    whole meadow froze solid. Trees sparkled, grass crunched, and a long ice slide curled between the
    practice posts. "Ice is easy!" A laugh came from nearby. "Easy, yes. Beautiful? That takes heart."
  image:
    prompt: Practice Meadow instantly transformed into a glittering ice rink, Sylfie standing in the center
      with her wand raised, looking pleased, trees sparkling with frost, an ice slide weaving between
      frozen practice dummies, Aria in the background looking stunned among her puddles
    characters_present:
    - aria
    - sylfie
    alt: Sylfie freezes the entire meadow into a sparkling ice wonderland with a flick of her wand
    text_zone: lower third
  layout:
    text_position: lower-third
    text_align: center
    scrim: true
- number: 4
  kind: story
  text: Aria turned. A round little wizard waddled toward her. His mustache curled like frost. He carried
    a steaming teapot. "The warmest heart makes the deepest ice," he said. "I'm Professor Chillworth.
    You are not a flop. You are a new ice-wizard." He handed her a cup. The tea was perfect.
  image:
    prompt: Close-up of Professor Chillworth waddling toward Aria across the frozen meadow, tiny tweed
      vest, silver spiral mustache, steaming teapot in one hand pouring into a small cup, his pink cheeks
      and twinkling eyes behind spectacles, Aria looking up at him with surprise and hope, the meadow
      glittering behind them
    characters_present:
    - aria
    - chillworth
    alt: Professor Chillworth waddles toward Aria, teapot in hand, calling her a beginner not a failure
    text_zone: lower third
  layout:
    text_position: lower-third
    text_align: center
    scrim: true
- number: 5
  kind: story
  text: 'Chillworth''s lessons were odd. "An ice cube on your nose! Both arms out! Sing!" "This is silly!"
    Aria giggled as the cube slid into her shirt. "Silly is how you learn to be brave," said the professor.
    Next: freeze a daisy. Don''t crush it. Aria tried twelve times. On the last try, the daisy sparkled
    — cold and perfect.'
