slug: ice-and-sparks
world: strongest-wizard
title: Ice and Sparks
logline: Aria tries to learn ice magic but keeps making puddles — until a funny penguin-shaped teacher
  shows her that cold magic comes from a warm heart, and Sylfie finds a real rival.
summary: Aria finds a frosty spellbook and wants to learn ice magic, but every spell turns to slush. Sylfie
  freezes things without trying. When a round, riddling wizard named Professor Chillworth comes to the
  meadow, Aria learns that ice is not about being cold — it is about heart. She asks Sylfie for an ice
  fight, loses big, but wins Sylfie's respect. Together they fix a cracking ward stone, and Sylfie calls
  Aria her real rival.
