spine:
  once_upon_a_time: Aria loved the old ward stone that glowed at the edge of the village and kept the
    dark out.
  every_day: Every night it shone bright and warm, and the woods stayed quiet and safe.
  until_one_day: One night the ward stone went dim. It sputtered, pfft, pfft, and would not light.
  because_of_that:
  - Aria zapped it with a spell — but missed and froze Bram's lunch into a block of ice.
  - She tried again, and POOF, flowers grew all over Sylfie's hair until she sneezed petals.
  - 'The sky went dark, and two cold white eyes blinked open in the woods: Voidstalker was back.'
  until_finally: Aria's friends grabbed her hands and they all cast the spell at once, in one big silly
    burst.
  ever_since_then: The ward stone blazed bright, the dark slunk away grumbling, and every night they woke
    the stone with a messy magic high-five.
