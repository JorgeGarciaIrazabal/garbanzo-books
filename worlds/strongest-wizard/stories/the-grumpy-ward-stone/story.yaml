slug: the-grumpy-ward-stone
world: strongest-wizard
title: The Grumpy Ward Stone
logline: When the village ward stone goes grumpy and dim, Aria's spells to relight it keep misfiring —
  just as Voidstalker creeps back from the woods, and only a big messy burst of magic with her friends
  can wake the stone before dark.
summary: The old ward stone that keeps Whisper Village safe sputters out and won't light. Aria tries to
  zap it bright again, but her spells go wonderfully wrong — frozen lunches, flowery hair — while the
  scarred Voidstalker waits in the dark for the light to die. In the end Aria and her friends cast all
  their messy magic together, and the joyful, sparking, flower-popping burst blazes the stone awake and
  shoos the shadow off.
age_band: 3-5
target_year: 5
