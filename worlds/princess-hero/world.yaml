  prompt_style_block: soft watercolor children's book illustration, warm dawn palette (#fdf6e3 cream, #ffb88c peach, #b8a0d6 lavender) by day; rich night palette (#1a2a4a midnight, #4ecdc4 teal, #ffd93d star-gold, #ff8fa3 rose) by night, rounded expressive characters, colored-pencil texture, gentle rim lighting, hand-painted paper grain, dynamic composition for action beats, cozy storybook mood, no text
