  line_quality: gentle, rounded, hand-drawn with energetic sketch lines for action
  shading: soft, low-contrast by day; richer jewel tones with glowing accents by night
  lighting: warm golden-hour glow for day scenes; cool moonlight with warm lantern pools and star-glitter for night
  perspective: eye-level, character-centered; dynamic low angles for hero moments
