slug: honey-cake-heist
world: princess-hero
title: The Great Honey-Cake Heist
logline: "Star-Strider and the Cat plot to steal the Queen's secret honey-cake stash \u2014 but the Queen has a deliciously sneaky plan of her own."
summary: "By day, Princess Liora endures royal tea parties. By night, Star-Strider and the Cat launch Operation Honey-Cake: infiltrate the Queen's tower, bypass the Advisor's alarms, and claim the legendary secret stash. Their glorious chaos wakes the castle \u2014 but the Queen was never asleep. She catches them red-handed... and serves them cake with a wink. The best heists are the ones you're invited to."
