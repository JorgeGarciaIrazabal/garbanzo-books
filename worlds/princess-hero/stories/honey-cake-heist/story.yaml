spine:
  once_upon_a_time: "Princess Liora wears a crown by day and a bedsheet cape by night. The kingdom sees a perfect princess. The cat sees a hero. The Queen sees both \u2014 and says nothing."
  every_day: By day, Liora smiles through ribbon-cuttings and curtsy lessons. By night, she and the Cat plot grand adventures from the hollow oak HQ. The Queen signs decrees with one eye on the tower window.
  until_one_day: "The Town Crier announces the Queen's Legendary Honey-Cakes \u2014 baked once a year, locked in the tower pantry, guarded by \"impenetrable protocols.\" Liora's stomach growls. The Cat's tail twitches. Operation Honey-Cake begins."
  because_of_that:
  - "Star-Strider and the Cat scale the castle walls, dodge the Advisor's clipboard tripwires, and outwit Captain Brindle's pastry-baited trap \u2014 but the pantry door is already open."
  - "Inside, they find not a lock \u2014 a note: \"For the Night Crew. \u2014 Q.\" And a tower of honey-cakes glowing in the moonlight."
  - The Queen appears in her midnight-blue robe, crown bent, crumbs on her chin. She does not scold. She pours milk.
  until_finally: Star-Strider and the Cat feast with the Queen on the tower roof, lanterns floating, stars leaning down. The best secret in the kingdom just got bigger.
  ever_since_then: "The honey-cake stash is never locked again. The Advisor writes a new protocol: 'Emergency Cake Access \u2014 Night Crew Only.' Captain Brindle still doesn't have a medal. But he gets the first slice."
