  silhouette_notes: Broad, blocky silhouette — helmet plume adds height, cape flares wide. Moustache points
    readable at distance. Boots-wide stance. Contrasts Advisor's thin vertical and Queen's flowing grace.
    The tilted plume is the readable anchor.
appearance_token: 'CAPTAIN BRINDLE: broad man 40s, sun-bronzed skin (#c49a6c), steel-gray stubble (#8a8a8a),
  waxed point moustache (#c0c0c0), bright blue crinkling eyes (#5dade2). ALWAYS: polished dented breastplate
  (#b8b8b8), tilted helmet with lavender plume (#9a9a9a/#b8a0d6), sage cape (#6b8f71), squeaky boots (#3d2b1f),
  belt with pastry pouches. POSTURE: wide stance, chest out, helmet askew, moustache semaphore. EXPRESSION:
  bellowing determination masking secret delight.'
