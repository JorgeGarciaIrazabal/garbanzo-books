slug: guard-captain
world: princess-hero
name: Captain Brindle
role: recurring
species: human adult
pronouns: he/him
one_liner: A loud, helmet-askew guard captain who chases Star-Strider nightly — and has never once caught
  her, though he's collected three capes.
personality:
  traits:
  - boisterous
  - determined
  - easily distracted
  - secretly impressed
  - pastry-motivated
  motivation: 'Catch the mysterious night hero (Star-Strider) and earn a shiny medal. Also: all the pastries.'
  fears:
  - The Queen's "disappointed" voice
  - Running out of helmet polish
  - Star-Strider outsmarting him (happens nightly)
  - The Advisor's clipboards
  flaws:
  - Announces his plans aloud ("I shall surround the rooftop!")
  - Falls for the oldest tricks (fake trails, "look behind you," pastry bait)
  - Helmet perpetually askew — blocks his vision at critical moments
  strengths:
  - Genuinely brave — runs toward danger while shouting
  - Incredible stamina — chases across rooftops all night
  - Loyal to the Queen (and the baker's apprentice's turnovers)
  - Accidentally creates better security by failing so spectacularly
  quirks:
  - Narrates his own actions like a sportscaster ("Captain Brindle scales the turret! The crowd goes wild!")
  - Names his helmet ("Sir Helm-a-Lot")
  - Has a secret scrapbook of Star-Strider sightings ("Evidence. For the medal.")
  - Salutes the cat. The cat slow-blinks.
  values:
  - Duty (loudly)
  - Honor (flexibly)
  - Pastries (desperately)
voice:
  speech_style: LOUD. Dramatic. Third-person self-narration. Declarative sentences. Volume = enthusiasm.
    The Queen whispers; he bellows.
  catchphrases:
  - HALT, MYSTERIOUS FIGURE!
  - Captain Brindle shall prevail!
  - By the Crown and the Codex!
  - Was that... a pastry? *sniff* Yes. Yes it was.
  vocabulary_level: Adult, theatrical, military-adjacent. Kids hear 'FUNNY LOUD MAN'; adults hear 'incompetent
    but trying.'
appearance:
  age_appearance: 40s, broad, weathered but bouncy
  build: Broad-shouldered, barrel-chested, moves like a happy bear
  height: Tallest guard; Advisor reaches his shoulder
  skin: Sun-bronzed (#c49a6c), laugh lines deep
  hair: Steel-gray stubble (#8a8a8a), once-blond moustache waxed to points
  eyes: Bright blue (#5dade2), crinkle at corners even when shouting
  outfit: Polished breastplate (dented left side), helmet with plume (permanently tilted), cape (regulation
    length, practical), sturdy boots, belt with 12 pouches (6 pastries, 3 handkerchiefs, 2 whistles, 1
    medal-polishing cloth).
  distinguishing_features:
  - Helmet plume tilted at 47-degree angle — never straight
  - Moustache waxed to dramatic points — semaphore for mood
  - Breastplate dented left side (Star-Strider's first escape)
  - Boots squeak on rooftops — Star-Strider hears him coming
  color_palette:
