slug: queen
world: princess-hero
name: Queen Amara
role: recurring
species: human adult
pronouns: she/her
one_liner: A sharp-eyed queen who secretly knows her daughter sneaks out at night — and is quietly, fiercely
  proud of the hero the kingdom doesn't know it has.
personality:
  traits:
  - perceptive
  - warm
  - strategically oblivious
  - playful (privately)
  - fiercely protective
  motivation: A kingdom that runs on joy, not just protocol — and a daughter who gets to be herself.
  fears:
  - Liora getting hurt (but knows she can't stop her)
  - The Royal Advisor's 47-page protocol for "Princess Bedtime"
  - Running out of honey-cakes before the mid-morning crisis
  flaws:
  - Pretends not to see what she sees — enables the chaos
  - Terrible at delegating; rewrites the Advisor's speeches at midnight
  - Hoards the best honey-cakes in a secret drawer
  strengths:
  - Sees everything. Everything.
  - Turns disasters into traditions (the Moon Festival "incident" is now annual)
  - Commands a room with a raised eyebrow
  - Knows exactly when to look the other way
  quirks:
  - Winks at the cat. The cat slow-blinks back.
  - Leaves the tower window unlatched "by accident"
  - Narrates her own life in dramatic internal monologue
  - Has a "thinking crown" (it's just a softer tiara)
  values:
  - Kindness over ceremony
  - Liora's freedom (within reason... generous reason)
  - A good laugh at the Advisor's expense
voice:
  speech_style: Regal warmth with a dry undertone. Speaks in proper sentences but the subtext is all mischief.
    Uses 'we' for royal decrees, 'I' for real talk.
  catchphrases:
  - 'The Advisor will have a report by morning. (translation: I''ll handle it)'
  - 'How... unexpected. (translation: I saw that, nice work)'
  - 'See that the baker sends up the usual. (translation: Liora''s hungry, feed the hero)'
  - Protocol exists for a reason. *does not follow it*
  vocabulary_level: Adult, elegant, layered with subtext. Kids hear the surface; adults hear the wink.
appearance:
  age_appearance: Early 30s, ageless grace with laugh lines around eyes
  build: Tall, poised, moves like water — never rushes, always arrives
  height: Head above the Advisor; Liora reaches her elbow on tiptoes
  skin: Warm olive-gold (#d4a574), rose-blush cheeks (#ff8fa3) when amused
  hair: Deep chestnut waves (#3d2b1f) with silver threads catching light, loose under crown or braided
    for 'thinking'
  eyes: Warm amber-gold (#c9a84c), crinkle at corners — miss nothing
  outfit: 'DAY: Flowing gowns in royal-lavender (#b8a0d6) and sunlit-peach (#ffb88c), practical hidden
    pockets, crown worn slightly tilted. NIGHT: Silk robe in midnight-blue (#1a2a4a) with star-gold embroidery
    (#ffd93d), barefoot on cold stone.'
  distinguishing_features:
  - Crown worn with intentional imperfection — one point always slightly bent
  - Amber-gold eyes that crinkle with secret laughter
  - Always has a honey-cake crumb somewhere on her person
  - The bent crown point aligns with Liora's star earring when they stand together
