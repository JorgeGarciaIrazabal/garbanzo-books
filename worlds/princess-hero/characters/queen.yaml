  silhouette_notes: 'Tall, flowing vertical line — crown silhouette distinct (bent point), gown sweeps
    floor. Warmth radiates from pose: head tilted listening, hand on hip, or wrist loose. Contrasts Advisor''s
    rigid vertical and Guard''s broad stance. The bent crown point is the readable anchor.'
appearance_token: 'QUEEN AMARA: tall poised woman early 30s, warm olive-gold skin (#d4a574), deep chestnut
  waves with silver threads (#3d2b1f/#c0c0c0), amber-gold crinkling eyes (#c9a84c), rose-blush cheeks
  (#ff8fa3). DAY: royal-lavender gown (#b8a0d6) with peach accents (#ffb88c), star-gold crown (#ffd93d)
  worn with one point intentionally bent, hidden pockets. NIGHT: midnight-blue silk robe (#1a2a4a) with
  star-gold embroidery (#ffd93d), barefoot. ALWAYS: knowing half-smile, relaxed regal posture, honey-cake
  crumb nearby, bent crown point aligning with Liora''s star when together.'
