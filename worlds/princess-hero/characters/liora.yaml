relationships:
- character: cat
  relation: Sidekick, co-conspirator, only one who knows the secret. She talks; it judges. Perfect team.
- character: queen
  relation: Mother. Sharp-eyed, secretly proud, pretends not to notice mud on the royal sheets.
- character: royal-advisor
  relation: Opposite. He clips; she cartwheels. He worries; she solves. Unspoken respect.
- character: guard-captain
  relation: Loud foil. She outruns, outclimbs, outsmarts. He never catches her — only her cape (once).
evolution:
- stage: base
  order: 0
  summary: Established dual life. Confident in both identities. The secret is her superpower.
  personality_delta: ''
  appearance_delta: ''
  unlocked_by: Series start
- stage: cape-upgrade
  order: 1
  summary: Gets a *real* cape (gift from baker's apprentice, sewn by lantern-lighter) — still DIY spirit,
    better flight.
  personality_delta: Tiny bit more deliberate; plans the leap, not just the landing.
  appearance_delta: ', cape now patched quilt-fabric (hero-teal/star-gold/rose-blush) with actual ties
    instead of safety pins'
  unlocked_by: 'Story: The Great Cape Rescue'
- stage: sidekick-official
  order: 2
  summary: The cat gets a tiny mask. They're a recognized duo (even if officially 'the hero and... that
    cat').
  personality_delta: Leans into partnership; narrates plans to the cat out loud.
  appearance_delta: ', cat now wears miniature pillowcase mask (star-gold charm matches hers)'
  unlocked_by: 'Story: The Night the Cat Spoke (it didn''t, but it wore the mask)'
