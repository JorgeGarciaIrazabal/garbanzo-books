slug: royal-advisor
world: princess-hero
name: Royal Advisor Pippin
role: recurring
species: human adult
pronouns: he/him
one_liner: A clipboard-clutching worrywart who writes 47-page protocols for everything — and secretly
  admires the chaos Liora brings.
personality:
  traits:
  - anxious
  - meticulous
  - secretly warm
  - rule-obsessed
  - exhausted
  motivation: A kingdom that runs on perfect order, predictable schedules, and zero surprises.
  fears:
  - Unscheduled events
  - The Queen's "improvisations"
  - Liora's scraped knees (he counts them. There are always scraped knees.)
  - Running out of clipboard paper
  flaws:
  - Overplans everything — has a contingency for the contingency's contingency
  - Cannot improvise; freezes when the plan meets reality
  - Takes himself *very* seriously (nobody else does)
  strengths:
  - Actually keeps the kingdom running (taxes, treaties, turnip tariffs)
  - Knows every law, precedent, and royal decree by heart
  - Protects Liora with bureaucracy (files the "Princess Bedtime" forms incorrectly on purpose)
  - The only one who can translate the Queen's wink into actionable policy
  quirks:
  - Talks to his clipboard ("Item 47 — Princess climbed the gargoyle. Again.")
  - Color-codes his worries (red = catastrophe, blue = mild concern, lavender = Liora-related)
  - Has a secret stash of honey-cakes in his desk (the Queen knows)
  - Measures roof tiles to calculate Liora's escape velocity
  values:
  - Order (theoretically)
  - The Queen (actually)
  - Liora's safety (desperately, quietly)
voice:
  speech_style: Fast, precise, slightly breathless. Speaks in clauses and sub-clauses. Uses 'Protocol
    dictates' as a shield. The Queen cuts through it with one look.
  catchphrases:
  - Protocol dictates...
  - This is highly irregular. (said about everything Liora does)
  - I have a form for that.
  - Your Majesty, if I may... (she never lets him finish)
  vocabulary_level: Adult, bureaucratic, overly formal. Kids hear 'blah blah RULES blah'; adults hear
    the panic.
appearance:
  age_appearance: Late 40s, prematurely lined from worry
  build: Tall, thin, slightly stooped from clipboard-carrying
  height: Tallest in court; Liora reaches his waist
  skin: Pale with ink-stained fingertips (#f5e6cc)
  hair: Mouse-brown, thinning, perpetually escaping a too-tight bun (#5d4e3d)
  eyes: Watery blue-gray (#7a8fa3), magnified by round spectacles, dart everywhere
  outfit: Gray-brown coat with 17 pockets (all full), waistcoat with ink stains, round spectacles on chain,
    clipboard fused to hand. Sensible shoes (polished nightly).
  distinguishing_features:
  - Round spectacles on chain — never off, even sleeping
  - Clipboard always in hand — extension of his arm
  - 'Posture: permanent slight lean-forward of anticipation'
  - Ink-stained fingertips (left hand only — right holds clipboard)
  color_palette:
  - part: skin
    hex: '#f5e6cc'
  - part: hair
    hex: '#5d4e3d'
  - part: eyes
    hex: '#7a8fa3'
  - part: spectacles
    hex: '#3d5a73'
  - part: coat
    hex: '#8b7d6b'
  - part: waistcoat
    hex: '#6b5b4a'
  - part: clipboard
    hex: '#d4c4a8'
  - part: ink-stains
    hex: '#2c3e50'
  silhouette_notes: Tall, thin vertical — clipboard makes a T-shape at hip level, spectacles catch light
    as twin circles. Stooped anticipation posture. Distinct from Queen's warm flow and Guard's broad stance.
    The clipboard is the readable anchor.
appearance_token: 'ROYAL ADVISOR PIPPIN: tall thin man late 40s, pale skin (#f5e6cc), mouse-brown thinning
  hair in tight bun (#5d4e3d), watery blue-gray eyes behind round spectacles (#7a8fa3/#3d5a73), ink-stained
  fingertips (#2c3e50). ALWAYS: gray-brown 17-pocket coat (#8b7d6b), stained waistcoat (#6b5b4a), clipboard
  fused to hand (#d4c4a8), spectacles on chain. POSTURE: stooped forward, clipboard raised, spectacles
  glinting. PERMANENT EXPRESSION: controlled panic.'
