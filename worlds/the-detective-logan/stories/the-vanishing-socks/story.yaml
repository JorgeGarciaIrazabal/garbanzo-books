  text: '3:33 — BONG went the faraway bell.



    And out of the fog came a gray blur. It swooped and swerved. Loop-the-loop — and SNATCH! The gold
    sock was gone off the rod!



    "THERE!" shouted Logan. "The Sock Snatcher! AFTER IT!"



    The gray blur whipped past Mayor Bumble, stealing his handkerchief too. The Mayor fainted gently into
    a flowerpot.



    "FOLLOW THAT FLUFF!" yelled Poppy, already running.'
