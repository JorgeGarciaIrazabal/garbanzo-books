- number: 1
  kind: story
  text: 'In the foggy little town of Maple Hollow, there is one detective.


    He is small. He is serious. He is VERY dramatic.


    His name is Logan. His detective office is a wooden shack at the bottom of the garden.


    Inside: a magnifying glass, a red notebook, and a fat folder labeled BIG CASE.


    Odd things happen here. Socks go missing. Strange bells ring. Nobody notices.


    But Logan is ALWAYS looking.'
