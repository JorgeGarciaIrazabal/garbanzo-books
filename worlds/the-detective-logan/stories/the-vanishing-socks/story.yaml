spine:
  once_upon_a_time: In the fog-wrapped little town of Maple Hollow, kid detective Logan runs his one-shack
    detective agency, scribbling every clue in his red notebook — because odd things keep going missing,
    and nobody grown-up ever believes him.
  every_day: Grown-ups pat Logan's head and say 'Don't be silly, Logan.' Mayor Bumble booms 'ALL IS WELL!'
    Rex the rival detective shouts wrong answers with total confidence — and every case ends with one
    small odd clue pinned in Logan's Big Case folder.
  until_one_day: At the grandest ribbon-cutting of the year, the town bell rings by itself at exactly
    3:33 — and every single sock in Maple Hollow vanishes at once, including the Mayor's famous polka-dot
    pair.
  because_of_that:
  - Mayor Bumble bans the truth — 'Nothing is missing. I checked.' (he did not) — and the judges of the
    Tidiest Town contest arrive tomorrow, so the whole case lands on Logan.
  - 'Poppy, the smartest and clumsiest girl in town, trips face-first into the first clue: a drift of
    gray sock-fluff. She counts three toes in every footprint (a BIRD, not a sock-monster!), and Ms. Crumb''s
    hot buns whisper the key — who else is hungry at 3:33?'
  - 'Rex loudly blames the ducks, the wind, and finally Logan, while Logan and Poppy set the only trap
    silly enough to work: the Mayor''s shiny gold ceremonial sock, hung where the whole town can see —
    at 3:33 sharp.'
  until_finally: The gold sock disappears in a gray blur, the chase leads through town to Hollow Park,
    and Poppy — who cannot walk past a puddle, a skate, or a rope — trips on the rope, tumbles through
    a hedge, and lands inside the hollow oak, right on a nest made of every stolen sock in Maple Hollow,
    where three baby birds wear little sock hats and one sock-hatted magpie mom is not a monster at all.
  ever_since_then: The town SEES it at last, the babies keep their cozy nest, Maple Hollow throws its
    first Sock Festival (with a ribbon, obviously), and the Big Case folder gains its strangest clue yet
    — a corner of an old map in grown-up handwriting. Who leaves maps in sock nests?
