- number: 2
  kind: story
  text: 'Every morning, Logan marches to Main Street.



    "Mayor Bumble!" he announces. "The garden gnome moved THREE houses last night. On its own!"



    Mayor Bumble puffs up like a proud balloon. "Don''t be silly, Logan! ALL IS WELL!"



    Then he cuts a brand-new ribbon, because he loves ribbons.



    Ms. Crumb the bakery lady slides a warm bun into Logan''s hand. She never says anything at all.



    But she sees EVERYTHING.'
