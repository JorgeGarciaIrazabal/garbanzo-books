- number: 10
  kind: story
  text: 'Over the rooftops! Past the windmill! Under the town clock!


    The gray thief swooped, dropping fluff like breadcrumbs, while Logan and Poppy pelted after it.


    "Count the fluffs, Poppy! Don''t lose the trail!"


    "ON IT!" said Poppy, who somehow passed Logan while running backwards.


    The trees of Hollow Park rose up ahead, dark and swaying.


    And the gray blur dove straight into the biggest, hollowest oak in town.'
