- number: 3
  kind: story
  text: 'One gray afternoon, it happened.



    Mayor Bumble was cutting the BIGGEST ribbon of the year. And the whole town was there.



    The clock ticked. Tick, tick — 3:32.



    And at exactly 3:33, the bell tower rang. BONG — all by itself!



    Principal Peabody frowned. "That is NOT on the schedule. The bell does not lie."



    But while every face was looking up...



    WHOOSH.



    Every sock in Maple Hollow vanished at once.'
