slug: the-vanishing-socks
world: the-detective-logan
title: The Case of the Vanishing Socks
logline: When every sock in Maple Hollow vanishes at exactly 3:33 and Mayor Bumble refuses to admit anything
  is missing, kid detective Logan and his counting-cracking friend Poppy must trap the Sock Snatcher themselves
  — before the Tidiest Town judges arrive tomorrow.
summary: 'Book one of the Detective Logan series. At the grandest ribbon-cutting of the year, the town
  bell rings by itself at 3:33 and every sock in Maple Hollow vanishes at once — even Mayor Bumble''s
  famous polka-dot pair. The grown-ups refuse to believe it, so Logan opens the case with Poppy, the clumsiest
  (and smartest) girl in town, who trips face-first into the first clue. Counting fluff trails, three-toed
  footprints, and one very hot bun-clue from Ms. Crumb lead them to a glorious gold-sock trap — and a
  chase that ends at a hollow-oak nest full of socks, three baby birds, and one sock-hatted magpie mom.
  The town finally SEES the truth, Maple Hollow throws its first Sock Festival, and Logan''s Big Case
  folder gains its strangest clue yet: a corner of an old map, in grown-up handwriting.'
