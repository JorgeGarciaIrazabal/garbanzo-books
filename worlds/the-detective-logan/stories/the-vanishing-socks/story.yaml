  text: 'Maple Hollow was quiet again.



    Almost.



    The next morning, a brand-new poster appeared on the Main Street board.



    It said: MISSING: 1 umbrella. 2 boots. 1 trombone.



    And at exactly 3:33, somewhere above the fog, a bell went BONG.



    Logan put on his coat. He picked up his magnifying glass.



    "Don''t be silly," he said with a big grin. "Be SUSPICIOUS."'
