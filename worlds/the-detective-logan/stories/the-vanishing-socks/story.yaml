  text: 'And that is when the whole town arrived.



    "Mayors, grown-ups, ducks — LOOK!"



    Everyone looked. Three babies in sock hats looked back.



    "The thief is a bird," said Logan. "A very good mom, and a very bad criminal. The socks went to a
