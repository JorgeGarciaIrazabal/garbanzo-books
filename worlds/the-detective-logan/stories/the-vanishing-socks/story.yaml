  text: 'That night, Logan closed the case in his red notebook.



    The thief: a magpie mom. The motive: three cold babies.



    But one clue did not fit at ALL.



    A corner of old paper. A map, with a windmill and a red X.



    In GROWN-UP handwriting.



    "Why would a bird line a nest with a map?"



    Into the folder it went.



    "It all fits now," said Logan. "Well. ALMOST."'
