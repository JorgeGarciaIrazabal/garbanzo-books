- number: 11
  kind: story
  text: 'A red string was tied around the oak. It was Logan''s very own trap string.



    Now, Poppy cannot walk past ANY string. So she tripped over it instantly.



    "Falling..." she announced, "...ON IT!"



    She tumbled through a hedge. She bounced once, twice — then SPLOOSH, right into the hollow of the
    great oak.



    Everything went still.



    "Um, Logan? You are not going to BELIEVE what I am sitting on."'
