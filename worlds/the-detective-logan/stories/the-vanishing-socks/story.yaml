- number: 5
  kind: story
  text: 'Logan needed the one brain in town as fast as his own.


    Luckily, she was on her way.


    Unluckily, she was on her way sideways.


    CRASH! BONK! SPLOSH! Poppy tripped over the bakery step and landed nose-first in a pile of fluff.


    "I''m fine!" said Poppy''s voice. "The CLUE is fine!"


    She sat up wearing a sock on her head. "Fluff, Logan! The thief went THAT way!"'
