  text: 'What do you do with fifty-nine stolen socks and three sleeping babies?



    "The babies keep them," said Logan. "It''s the coziest nest in history."



    Ms. Crumb appeared with a basket of 3:33 buns. "Buns for the babies. Both of them."



    The town knitted fifty-nine new pairs by moonrise.



    And the magpie returned the gold sock with a polite little drop.



    It landed right on Principal Peabody''s head.'
