- number: 4
  kind: story
  text: '"MY POLKA-DOT SOCKS!" yelled Mayor Bumble.



    "ALL IS WELL! Nothing is missing. I checked."



    He had not checked.



    "But Mayor," said Logan, "the Tidiest Town judges arrive TOMORROW. A tidy town has socks!"



    The Mayor went gray, like the fog.



    Then Rex stomped up. "HA! Elementary — THE DUCKS DID IT! Ducks have FEET, and feet need socks. CASE
    CLOSED!"



    The ducks looked very unimpressed.



    The case was not closed.'
