- number: 6
  kind: story
  text: 'Poppy counted. She always counted.



    "Fluff, fluff, fluff — a trail! And LOOK, Logan! Footprints!"



    Tiny footprints ran all along the fence.



    "Count with me!" said Poppy. "One toe, two toes, THREE toes!"



    Logan''s eyes went wide. "Not a sock-monster. And not a duck, because ducks have webby feet."



    "THREE toes," said Poppy, hopping from print to print. "So the thief has toes, fluff, and wings. Logan
    — it''s a BIRD."'
