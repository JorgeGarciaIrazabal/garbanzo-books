- number: 8
  kind: story
  text: '"Birds like shiny things and soft things," said Poppy. "So we need the shiniest, softest thing
    in town."



    Logan grinned, because he knew EXACTLY.



    "Mayor Bumble — we need your gold sock."



    "The ceremonial gold sock?! It is a HUNDRED years old!"



    "The judges come tomorrow. Your socks back... or your sock?"



    So they hung the gold sock over the fountain and hid.



    3:31... 3:32...



    "Count with me," whispered Poppy. "3:32... and a half..."'
