  text: 'The fluff trail ended at the best-smelling place in town: Ms. Crumb''s bakery.



    At 3:33 her buns came out of the oven, hot and golden, every single day.



    "Ms. Crumb," said Logan, "did you see anything unusual?"



    "Do I?" said Ms. Crumb. "Whoever took your socks is hungry at 3:33."



    Poppy gasped. "Logan! The bell rings at 3:33, and the buns come out at 3:33! It''s not just WHEN —
    it''s DINNER TIME!"'
