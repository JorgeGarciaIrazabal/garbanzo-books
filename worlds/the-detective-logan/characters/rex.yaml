slug: rex
world: the-detective-logan
name: Rex
role: recurring
species: human kid
pronouns: he/him
one_liner: The know-it-all rival detective who solves every case wrong — LOUDLY.
personality:
  traits:
  - supremely confident
  - always wrong
  - extremely loud
  - jealous of Logan
  - secretly wants to be liked
  motivation: To out-detective Logan ONCE — just once — and get his face on the town notice board.
  fears:
  - being ordinary
  - everyone finding out he once asked Logan for help
  flaws:
  - jumps to the WORST conclusion instantly and defends it forever
  - cannot admit a mistake even mid-faceplant
  - hides evidence that proves him wrong
  strengths:
  - endless confidence
  - surprisingly good at being in the right place (for the wrong reasons)
  - his wrong guesses accidentally give Logan the real clue
  quirks:
  - has a bigger magnifying glass than Logan and mentions it constantly
  - names his guesses ('I call it... The Ghost Duck Theory')
  - keeps a personal scoreboard where he is mysteriously winning
  values:
  - being FIRST
  - big announcements
  - never updating his scoreboard
voice:
  speech_style: booming announcements, dramatic pauses, wrong conclusions delivered with total certainty
  catchphrases:
  - HA! Elementary!
  - The clues are OBVIOUS!
  - Case closed! (they were not closed)
  - Logan, your magnifying glass is smaller.
  vocabulary_level: 'age 5-7: big announcing words used slightly incorrectly'
appearance:
  age_appearance: 7 years old
  build: round and puffy, like a confident marshmallow
  height: a bit taller than Logan, broader than both
  skin: pale with pink cheeks
  hair: orange, flat and neat on top, combed with detective dedication
  eyes: green, squeezed shut whenever he announces a conclusion
  outfit: green blazer with a gold detective badge sticker, bowtie, checked cap, giant magnifying glass
    (slightly too big for him), clipboard of wrong conclusions
  distinguishing_features:
  - giant oversized magnifying glass
  - gold detective badge sticker on green blazer
  - bowtie
  - checked cap
  color_palette:
  - part: blazer
    hex: '#6a994e'
  - part: bowtie
    hex: '#d94f3d'
  - part: cap
    hex: '#2e4a7d'
  - part: hair
    hex: '#e07a2f'
  - part: skin
    hex: '#f2b898'
  - part: badge
    hex: '#f2b134'
  silhouette_notes: wide round shape + enormous magnifying glass nearly his own size + bowtie — instantly
    distinct from lean Logan and springy Poppy
