slug: principal-peabody
world: the-detective-logan
name: Principal Peabody
role: recurring
species: human grown-up
pronouns: she/her
one_liner: The school principal who believes in rules, bells, and blaming Logan.
personality:
  traits:
  - strict
  - suspicious of fun
  - secretly sharp-eyed
  - loves her bell schedule
  - never apologises
  motivation: To run the tidiest, quietest, most punctual school in the world — no mysteries allowed on
    the schedule.
  fears:
  - chaos in the corridors
  - her bell ringing at the wrong time (like 3:33)
  - being proven wrong in front of students
  flaws:
  - assumes ANY mess near Logan is Logan's mess
  - so rule-bound she misses what is right in front of her
  - would rather dust the trophy case than hear an explanation
  strengths:
  - notices everything about the school building — squeaky doors, crooked posters
  - her timing is perfect — she ALWAYS appears exactly one second after a prank
  - deep down, her suspicious streak matches Logan's
  quirks:
  - carries a brass hand-bell everywhere, even outdoors
  - measures skirt lengths, hedge heights and smiles with the same stern ruler
  - keeps a 'LOGAN FILE' that is mostly drawings of Logan looking innocent
  values:
  - order
  - the bell schedule
  - quiet feet
voice:
  speech_style: crisp clipped sentences, one eyebrow up, questions that are really verdicts
  catchphrases:
  - Whose mess is this? LOGAN'S.
  - That is NOT on the schedule.
  - The bell does not lie. (it had been lying)
  - Quiet feet!
  vocabulary_level: 'grown-up stern with kid-readable rhythm: ''hmm'', ''indeed'', ''we shall see'''
appearance:
  age_appearance: 50s, crisp
  build: tall and thin like a folding ruler
  height: the tallest grown-up in town; kids crane up at her
  skin: pale
  hair: iron-grey bun, not one strand loose, pencil never far from it
  eyes: sharp grey, one eyebrow permanently raised
  outfit: navy pleated dress, grey cardigan buttoned to the top, brass hand-bell in hand, tiny key ring
    of every door in the school jangling at her hip, sensible flat shoes
  distinguishing_features:
  - brass hand-bell always in hand
  - iron-grey bun
  - permanently raised eyebrow
  color_palette:
  - part: dress
    hex: '#2e4a7d'
  - part: cardigan
