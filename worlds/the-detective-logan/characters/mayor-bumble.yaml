    hex: '#d94f3d'
  - part: hat
    hex: '#1f1a17'
  - part: mustache
    hex: '#d9d3c8'
  - part: skin
    hex: '#f2b898'
  silhouette_notes: parade-balloon roundness + top hat taller than sensible + sash diagonal across the
    chest — pure outline says 'the mayor'
