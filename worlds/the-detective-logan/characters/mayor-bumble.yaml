slug: mayor-bumble
world: the-detective-logan
name: Mayor Bumble
role: recurring
species: human grown-up
pronouns: he/him
one_liner: The mayor who cuts every ribbon twice and believes exactly nothing.
personality:
  traits:
  - pompous
  - loud
  - wrong with total confidence
  - loves ceremonies
  - secretly fond of kids
  motivation: To keep Maple Hollow tidy, calm, and 100% mystery-free — mystery is BAD for ribbon-cutting.
  fears:
  - the town panicking
  - his sash getting wrinkled
  - having to say 'I was wrong' (he physically cannot)
  flaws:
  - explains away EVERY mystery before hearing it
  - never says 'I was wrong' — says 'I knew that, obviously' instead
  - cannot resist a ribbon, even a suspicious one
  strengths:
  - his ceremonies accidentally gather the whole town (useful for reveals)
  - surprisingly fast when fleeing ducks
  quirks:
  - measures everything with a tiny gold ruler
  - his sash is always slightly crooked
  - ends every speech with 'ALL IS WELL'
  values:
  - order
  - ceremony
  - all is well (it is not)
voice:
  speech_style: big booming announcement voice, even for 'good morning'
  catchphrases:
  - ALL IS WELL!
  - Don't be silly, Logan!
  - Nothing is missing. I checked. (he did not)
  - As mayor...
  vocabulary_level: 'grown-up bombast that kids find ridiculous: ''preposterous!'', ''outlandish!'', ''harrumph!'''
appearance:
  age_appearance: round 50s
  build: round and wobbly like a walking parade balloon
  height: tall, but stoops to pat kids on the head
  skin: rosy pink, always slightly sweaty on ceremony days
  hair: grey side-part, mustache like a little broom
  eyes: small blue behind tiny round spectacles
  outfit: navy suit, wide gold mayor sash (always slightly crooked), red bowtie, tiny gold ruler in breast
    pocket, polished shoes, comically tall top hat
  distinguishing_features:
  - gold mayor sash worn slightly crooked
  - broom mustache
  - comically tall top hat
  color_palette:
  - part: suit
    hex: '#2e4a7d'
