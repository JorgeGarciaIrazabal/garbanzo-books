slug: ms-crumb
world: the-detective-logan
name: Ms. Crumb
role: recurring
species: human grown-up
pronouns: she/her
one_liner: The bakery lady who 'never sees anything' — and slips Logan clues with his buns.
personality:
  traits:
  - warm and flour-dusted
  - serene
  - mysterious
  - sees everything
  - says almost nothing
  motivation: To keep her bakery the coziest spot in town — and to quietly watch over the kids who notice
    things.
  fears:
  - nobody noticing what she notices
  - burnt buns
  - the windmill being opened by the WRONG person
  flaws:
  - answers questions with questions ('Do I?')
  - so calm that kids walk away before realising she just told them everything
  - hides what she knows behind baking metaphors
  strengths:
  - the best listener in Maple Hollow
  - her bakery sits opposite the notice board — she sees EVERYTHING
  - leaves exactly the right clue at exactly the right moment
  quirks:
  - always has flour on her cheek and a fresh bun for detectives
  - names buns after mysteries ('Whodunit buns', 'The Case of the Crumbly Scone')
  - smiles one tiny smile when Logan gets something right
  values:
  - watching quietly
  - feeding people
  - secrets kept in good hands
voice:
  speech_style: soft, slow, cozy sentences that turn out to be clues; often answers with 'Do I?' or 'Is
    that so?'
  catchphrases:
  - Do I?
  - Is that so?
  - Careful — those buns are hot. Both of them.
  - The oven sees everything. It has a window.
  vocabulary_level: 'grown-up gentle: riddle-warm, short cozy sentences'
appearance:
  age_appearance: grandma age, timeless
  build: small, round and cozy like a fresh loaf
  height: short — Logan's eye level, which is exactly how she likes it
  skin: warm and soft, dusted with flour
  hair: white and wispy, in a bun that looks exactly like a bread roll
  eyes: twinkly grey behind small round glasses, always a step ahead
  outfit: cream apron dusted with flour over a navy dress, red-check tea towel over one shoulder, oven
    gloves peeking from apron pocket, a tiny brass key on a ribbon around her neck (kept tucked away)
  distinguishing_features:
  - flour-dusted cheek
  - bread-roll bun hairdo
  - red-check tea towel on shoulder
  - tiny brass key on a ribbon (rarely visible)
