slug: logan
world: the-detective-logan
name: Logan
role: protagonist
species: human kid
pronouns: he/him
one_liner: The kid detective nobody believes — but who is always, ALWAYS right.
personality:
  traits:
  - super observant
  - stubborn as glue
  - dramatically serious
  - mischievous
  - patient like a cat outside a mouse hole
  motivation: To prove to the whole town that the strange things in Maple Hollow are REAL — and to find
    out who is behind the Map of Lost Things.
  fears:
  - nobody EVER believing him
  - a case going cold
  - losing his red notebook
  flaws:
  - overthinks everything
  - gets so lost in clues he forgets doors exist
  - cannot let an 'I told you so' go unsaid
  strengths:
  - spots tiny things nobody else sees
  - wildly ingenious traps
  - never gives up on a case
  quirks:
  - talks to clues like they can hear him ('what are you HIDING, footprint?')
  - scribbles notes on anything — walls, hands, one time the mayor's hat
  - dramatic detective pose before saying something obvious
  values:
  - evidence over opinions
  - the truth is worth the trouble
  - never say never
voice:
  speech_style: short, certain, dramatic sentences — announces deductions like headline news
  catchphrases:
  - A clue!
  - It all fits now!
  - Don't be silly — be SUSPICIOUS.
  - The truth pops out. It always does.
  vocabulary_level: 'age 5-7: short words, punchy delivery, one fancy detective word per case used proudly'
appearance:
  age_appearance: 6-7 years old
  build: small and lean, all elbows and knees
  height: head shorter than Poppy
  skin: warm tan
  hair: dark brown, permanently cowlicked, sticking up at the back like he ran to the case
  eyes: big dark brown, permanently narrowed in suspicion
  outfit: kid-sized beige trench coat with the collar popped, deerstalker detective hat, red scarf, red
    notebook in one coat pocket, magnifying glass in the other, sneakers
  distinguishing_features:
  - deerstalker hat pulled low over narrowed eyes
  - oversized beige trench coat with popped collar
  - red notebook always in hand or pocket
  color_palette:
  - part: coat
    hex: '#d9b382'
  - part: hat
    hex: '#8a6f4d'
  - part: scarf
    hex: '#d94f3d'
  - part: notebook
    hex: '#d94f3d'
  - part: hair
    hex: '#4a3728'
  - part: skin
    hex: '#c68e5c'
  - part: sneakers
