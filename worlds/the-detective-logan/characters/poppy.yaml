slug: poppy
world: the-detective-logan
name: Poppy
role: protagonist
species: human kid
pronouns: she/her
one_liner: Super-smart code-cracker and spectacularly clumsy — the girl who trips over the truth.
personality:
  traits:
  - brilliant with numbers
  - spectacularly clumsy
  - cheerfully unbothered
  - bold
  - notices patterns everywhere
  motivation: To crack the trickiest code in town side by side with Logan — and to beat her own record
    for Best Fall Ever.
  fears:
  - sitting still too long
  - a puzzle with no answer
  - smooth floors (nothing to trip on, suspicious)
  flaws:
  - cannot walk past a puddle/skate/rope without demonstrating physics
  - counts out loud at the worst moments
  - trusts her feet less than her brain — rightly
  strengths:
  - counts, plans, and cracks codes faster than anyone
  - her falls always land on the needed clue
  - turns disasters into plans
  quirks:
  - narrates her own tumbles ('Grace... FAILING.')
  - sees numbers and patterns in everything — fences, ducks, cake slices
  - keeps score of everything, including falls per case
  values:
  - two brains beat one
  - every fall is a clue in disguise
  - try again funnier
voice:
  speech_style: fast, bright, counts things mid-sentence — 'TWO footprints! Not one. TWO!'
  catchphrases:
  - I'm fine! The CLUE is fine!
  - Count with me!
  - Falling... on it!
  - That's a pattern!
  vocabulary_level: 'age 5-7: simple words, loves numbers and counting out loud'
appearance:
  age_appearance: 6-7 years old
  build: small and springy, all bounce
  height: a head taller than Logan
  skin: deep brown
  hair: black, wild and curly, huge escaping ponytail with a red scrunchie, one curl always over her eye
  eyes: 'big bright amber, wide with delight (mid-fall: even wider)'
  outfit: denim overalls with one strap always slipping, mismatched striped socks (one gold, one navy),
    bandaged knee (fresh every case), red sneakers, pencil tucked behind her ear
  distinguishing_features:
  - wild ponytail escaping in every direction
  - permanently bandaged knee
  - mismatched striped socks
  - pencil behind ear
