slug: the-detective-logan
title: The Detective Logan
tagline: Nobody believes Logan. Poppy trips on the truth. Every time.
premise: 'Strange things happen in Maple Hollow. Socks vanish. A bell rings at 3:33. Tiny footprints appear
  in the fog. Logan, kid detective, knows something is up — but grown-ups just say: ''Don''t be silly,
  Logan.'' Nobody believes him. Nobody! Good thing Logan is super smart. He spots tiny things nobody else
  sees. And his girlfriend Poppy is super smart too — she counts, she plans, she cracks codes, and her
  big brain works even FASTER mid-fall. Because Poppy is also the clumsiest girl in town. She trips, she
  tumbles... and lands right on the clue they needed. Every time! Together they set traps, follow footprints,
  and crack secret codes until the truth pops out — BANG! Every case ends with one odd little clue that
  does not fit. Logan keeps those in his Big Case folder. Piece by piece, they are building a giant secret:
  the Map of Lost Things. Who is behind it? One day all the pieces will click together — and that last
  mystery will be HUGE.'
