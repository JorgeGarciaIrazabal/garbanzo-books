geography:
  overview: 'Maple Hollow: a snug, slightly bonkers small town where every street corner hides a clue
    and every grown-up is a suspect.'
  locations:
  - name: Logan's Detective Shack
    description: A hand-painted lemonade-stand-turned-headquarters in Logan's backyard, stacked with case
      files, magnifying glasses, and a wall of red string (that mostly connects to the fridge).
    mood: proud and cluttered
    recurring: true
  - name: Maple Hollow Main Street
    description: Cobbles, a bakery that smells like toast, and a notice board where every missing-pet
      poster gets pinned. The centre of almost every mystery.
    mood: busy and chatty
    recurring: true
  - name: The Old Windmill
    description: A creaky windmill on Hollow Hill with a locked top room nobody has opened in years. Somewhere
      in it, the Map of Lost Things hides.
    mood: creaky and secret
    recurring: true
  - name: Hollow Park & Duck Pond
    description: Ducks who steal hats, a bandstand that echoes whispers, and bushes big enough to hide
      two spies.
    mood: sunny with shady corners
    recurring: true
  - name: Mosswood Forest
    description: The foggy woods at the edge of town where footprints appear and vanish. Where the trail
      always leads when a mystery gets serious.
    mood: foggy and hushy
    recurring: true
rules:
- id: no-listening
  text: Grown-ups never simply believe Logan — the fun is always in inventing a trick, a trap, or a spectacular
    reveal that makes them SEE it. Evidence wins; words never do.
- id: super-smart
  text: Logan and Poppy are both super smart, each in their own way. Logan spots tiny things nobody else
    sees — a crooked footprint, a fresh crumb, a face that says 'I did it'. Poppy thinks in numbers and
    patterns — she counts, plans, and cracks codes faster than anyone. Their brains work best together,
    and they know it.
- id: poppy-luck
  text: 'Poppy''s clumsiness is never wasted: at least once per case her tumble, trip, or dropped sandwich
    accidentally uncovers the exact clue they needed. She is super smart AND super clumsy — and she lands
    on the answer on purpose as often as by accident.'
- id: fair-play
  text: 'Every mystery is solvable: all clues needed are shown to the reader on the page. No magic explains
    anything — sneaky, silly, or ingenious things do.'
- id: puzzle-powered
  text: 'Locks, codes, traps, and clues in this world run on kid-sized puzzles: counting, patterns, mazes,
    simple codes, and math riddles — never on grown-up tools.'
- id: clues-keep
  text: Every case ends with one small odd clue that does not fit — and it goes into Logan's Big Case
    folder. Those pieces are quietly building the Map of Lost Things.
- id: shadows-not-scares
  text: Mystery mood comes from fog, shadows, creaks, and 'who was THAT?' silhouettes — never from anything
    truly scary. The creepy thing always turns out to be silly.
- id: town-scale
  text: 'The stakes are always town-sized and kid-solved: no police, no grown-up fixes it, no magic swoops
    in. If Logan and his friends don''t crack it, it stays cracked-open.'
factions:
- name: The Detective Shack
  description: 'Logan + Poppy: the kid detective who sees everything and the clumsy girl who trips over
    the truth. Two chairs, one magnifying glass, endless snacks.'
  values: evidence over opinions, snacks during stakeouts, never say never
- name: The Grown-Up Council of No
  description: The mayor, the principal, and other adults who pat Logan on the head, say 'Don't be silly',
    and miss everything. Not villains — just gloriously wrong.
  values: tidy explanations, bedtimes, absolutely no climbing fences
- name: The Whisperers
  description: Somebody unseen is leaving riddles, footprints, and tiny thefts all over town. WHO? Nobody
    knows. Every case brings one new weird clue about them.
  values: riddles first, reasons later
timeline:
- label: The First Case
  description: Logan opens the Detective Shack and solves his first mystery. Poppy joins after tripping
    over the missing thing on day one.
- label: The Odd Clues
  description: Case by case, clues that don't fit pile up in the Big Case folder. Strange. Very strange.
    They seem to make a shape... a map?
- label: The Map of Lost Things
  description: 'The final epic case: every piece clicks, the windmill''s locked room opens, and the Whisperer
    stands revealed in one spectacular night.'
motifs:
- Logan's red notebook — every clue gets scribbled in it, and pages flip back in later books
- The magnifying glass that Poppy keeps dropping at exactly the wrong moment
- Leftover clue pieces that don't fit — folded, pinned, and waiting in the Big Case folder
- Red string on the Shack wall connecting clues (and occasionally fruit)
- The number 3:33 — the time odd things keep happening
- Missing-item posters on the Main Street board, one new one every case
themes:
- mystery
- puzzles
- sneaky cleverness
- teamwork between a schemer and a klutz
- small kids seeing what grown-ups miss
