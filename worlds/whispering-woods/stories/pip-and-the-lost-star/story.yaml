slug: pip-and-the-lost-star
world: whispering-woods
title: Pip and the Lost Star
logline: When a little star falls into the woods, timid Pip must cross the dark pines to put it back in
  the sky.
summary: Pip finds a glowing acorn-star fallen by the stream. With gentle Olo's help, she gathers her
  courage, counts to three, and carries the star home through the Tall Dark Pines — and learns that being
  small does not mean being scared forever.
age_band: 5-7
reading_level:
  target_fk_grade: 1.0
  fk_grade_tolerance: 1.0
  lexile_range: BR100L-300L
  fountas_pinnell: E
  max_words_per_page: 60
  max_sentence_words: 8
  decoding_focus: 'short vowels, CVC words, digraph sh/th; sight words: the, a, is, to, said, you, was,
    her, of'
  decodable: false
themes:
- courage
- friendship
- facing fears
moral: Being brave means doing it even when you feel small.
characters:
- slug: pip
  stage: timid
  role_in_story: protagonist
- slug: olo
  stage: base
  role_in_story: mentor
spine:
  once_upon_a_time: Pip the hedgehog lived snug in the Whispering Woods.
  every_day: She played by the Mossy Stream but never went near the dark pines.
  until_one_day: A little star fell from the sky and landed in the woods.
  because_of_that:
  - Pip found the star, but it was cold and growing dim.
  - Olo told her the star must go back through the Tall Dark Pines.
  - Pip was scared of the dark, and almost left the star behind.
  until_finally: Pip counted to three and carried the star home to the sky.
  ever_since_then: Pip knew that being small did not mean being scared forever.
