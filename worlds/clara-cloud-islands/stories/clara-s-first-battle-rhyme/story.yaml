spine:
  once_upon_a_time: Clara has Pip and Moxie, and she is READY for her first real Pokemon battle.
  every_day: She bossily challenges clouds, berries, and Pip to "battle" — but nothing fights back. She wants a REAL trainer battle with REAL stakes and REAL rhymes.
  until_one_day: On Battle Bridge Island — a spectacular rainbow rope-bridge arena suspended between two cloud islands — Clara meets Mina, a spunky girl her age with a bouncy pink Jigglypuff. Mina accepts Clara's challenge.
  because_of_that:
  - The rhyming battle begins on the wobbly bridge. Clara shouts terrible rhymes, Mina counters with good ones. Pip sneezes fire, Jigglypuff sings — chaotic and FUNNY.
  - Team Rocket's balloon drops from the clouds! Jessie, James, and Meowth recite their motto in PERFECT RHYME and snatch BOTH Jigglypuff and Pip in a giant net.
  - Clara and Mina — rival trainers seconds ago — must team up to chase the balloon across cloud islands. Clara notices Jigglypuff's song is putting the Rocket grunts to sleep but the net is too high.
  - 'Clara has a TERRIBLE rhyming rescue plan: Moxie makes a glitter-dust cloud, Mina throws Clara on top, Clara surfs up, Pip sneezes a MASSIVE flame from INSIDE the net burning the rope.'
  - Jigglypuff and Pip fall. Clara catches Pip, Mina catches Jigglypuff. Team Rocket blasts off rhyming.
  until_finally: 'On the bridge, safe. Jigglypuff wakes up, looks at Mina then at Clara and WADDLES OVER TO CLARA, snuggling into her hoodie pocket beside Pip. Mina says: "She chose you?" Clara grins: "I did not catch her. She caught ME."'
  ever_since_then: Mina is not mad. She is IMPRESSED. She and Clara become best friends. Mina joins Clara as a travel companion. Jigglypuff joins Clara's team. Three friends and three Pokemon cross the rainbow bridge toward the next adventure.
