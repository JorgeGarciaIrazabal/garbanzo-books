slug: clara-s-first-battle-rhyme
world: clara-cloud-islands
title: Clara's First Battle Rhyme
logline: Bossy little Clara challenges spunky new trainer Mina to her first-ever Pokemon battle on a rainbow rope-bridge arena — but when Team Rocket crashes the match to snatch both their Pokemon, Clara's terrible rhymes and brave heart win a new Pokemon AND a new best friend.
summary: 'Clara has Pip and Moxie, and she is READY for her first real Pokemon battle. She practices her battle rhymes in the mirror — she is TERRIBLE at rhyming but convinced she is a poetry genius. On Battle Bridge Island, a spectacular arena of rainbow rope-bridges, she meets Mina, a spunky girl her age with a bouncy pink Jigglypuff. Mina accepts Clara''s challenge. The battle is a chaotic rhyme-off on the wobbly bridge — Clara''s terrible rhymes versus Mina''s good ones. Suddenly, Team Rocket''s balloon drops from the clouds! Jessie, James, and Meowth recite their motto in perfect rhyme and snatch BOTH Jigglypuff and Pip in a giant net. Clara and Mina — rivals seconds ago — must team up to chase them across cloud islands. Clara has a terrible rhyming rescue plan: surf up on Moxie''s glitter-dust cloud and burn the net with Pip''s sneeze. It WORKS. Jigglypuff and Pip are rescued. And Jigglypuff — impressed by Clara''s brave, kind heart — chooses Clara as her new trainer. Mina accepts
  it gracefully, and the two girls become best friends and travel companions. Three friends, three Pokemon, infinite terrible rhymes.'
