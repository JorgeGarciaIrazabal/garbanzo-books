slug: clara-and-the-first-beautiful-pokemon
world: clara-cloud-islands
title: Clara and the First Beautiful Pokemon
logline: Clara wants to catch her very first beautiful Pokemon, but the shy glittery crystal moth she finds keeps hiding, and Clara must try, and try, and try again to win her trust.
summary: 'Clara already has Pip, her tiny fire-mouse sidekick, and now she wants a beautiful Pokemon all her own. She follows a trail of sparkly glitter-dust to a quiet clearing on Sparkle Volcano Island, where she finds a glittery crystal moth named Moxie. Clara yells her loudest catchphrase and Moxie flutters away. Clara tries again and again — too loud, too fast, too grabby — and Moxie keeps hiding. Each time she fails, Clara notices one tiny new thing; the dust trail, the color of the wings, the heart-shape of the antennae. She tries quieter, then softer, then stiller. After many tries, Moxie finally lands on Clara''s hand and chooses her. Clara learns that never giving up does not mean being loud — it means trying a new way, again and again, until a friend says yes.

  '
age_band: 5-7
reading_level:
  target_fk_grade: 0.8
  fk_grade_tolerance: 0.5
  lexile_range: BR-250L
  fountas_pinnell: A-C
  max_words_per_page: 20
  max_sentence_words: 6
  decoding_focus: 'CVC words (short e, short o, short u blends); sight words: one, two, three, try, again, soft, kind, here, said, want, find, run, fly, look; new: beautiful, glitter, wings, moth, sparkly, quiet, trust, friend, never, give, up'
  decodable: false
themes:
- never giving up
- patience
- friendship
- being kind
- trying a new way
moral: Never giving up means trying a new way.
