spine:
  once_upon_a_time: Clara already has Pip, her tiny fire-mouse sidekick, and now she wants her very first BEAUTIFUL Pokemon.
  every_day: She looks for sparkly Pokemon on every island, but they all run away when she yells.
  until_one_day: On Sparkle Volcano Island, Clara sees a trail of glitter-dust floating in the air, and follows it to a quiet clearing.
  because_of_that:
  - She finds a glittery crystal moth with rainbow wings, and yells her loudest catchphrase — but the moth flutters away and hides.
  - Clara tries to be QUIET, but she is still too fast. She tries to be STILL, but she is still too loud. She tries a SOFT voice, but she forgets and grabs. Each time, the moth hides somewhere new.
  - Each time she fails, Clara notices one tiny new thing — her violet eyes, her crystal-tipped antennae, the way her wings fold like a cloak. She remembers, and she tries a new way.
  until_finally: Clara sits very, very still and says one kind, soft word. The moth lands on her hand and chooses Clara. Beautiful and hers.
  ever_since_then: Clara and Pip and Moxie explore the cloud islands together. Clara still yells BEAUTIFUL at sparkly things — but now she remembers to try a new way, again and again, until a friend says yes.
