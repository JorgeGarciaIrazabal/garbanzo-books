slug: clara-and-pip
world: clara-cloud-islands
title: Clara and Pip
logline: A loud, sparkle-loving girl lands on a cloud island, scares away the tiny Pokemon who hatches
  there, and must be quiet and kind to win him as her first friend.
summary: Clara is a bossy, super-smart 5-year-old who loves sparkly things and wants a beautiful Pokemon
  of her own. But she's too loud — every Pokemon runs away. One day a balloon lifts her up to a pink cloud
  island. She finds a glowing egg under a berry bush, it hatches, and out pops Pip, a tiny fire-mouse
  Pokemon. When Clara shouts "MINE!", Pip runs. To find him and become his friend, Clara must solve a
  trail of logic puzzles across the island, learning that quiet kindness works better than loud bossiness.
  In the end, Pip chooses her — jumping into her hoodie pocket — and Clara learns to listen before she
  yells.
age_band: 5-7
reading_level:
  target_fk_grade: 0.5
  fk_grade_tolerance: 0.5
  lexile_range: BR-200L
  fountas_pinnell: A-B
  max_words_per_page: 20
  max_sentence_words: 6
  decoding_focus: 'CVC words (short a i o u); sight words: the, is, a, she, he, and, in, up, not, so,
    big, run, pop, look, said, yes'
  decodable: false
themes:
- friendship
- kindness
- perseverance
- listening
moral: Quiet words make big friends.
characters:
- slug: clara
  stage: base
  role_in_story: protagonist
- slug: pip
  stage: base
  role_in_story: sidekick
spine:
  once_upon_a_time: Clara is a bossy little girl who loves sparkly things and wants a beautiful Pokemon
    of her own.
  every_day: She yells and chases Pokemon, but every Pokemon runs away.
  until_one_day: A runaway balloon lifts her up to a pink cloud island in the sky.
  because_of_that:
  - She hears squeaks, follows them, and finds a glowing egg under a berry bush. The egg hatches — out
    pops Pip, a tiny fire-mouse Pokemon.
  - Clara shouts "MINE!" and Pip gets scared, running into the berry bushes.
  - 'To find Pip, Clara solves three logic puzzles: following his flame-puff trail, using clues to pick
    the right hiding spot, and choosing kind words over bossy ones.'
  until_finally: Clara finds Pip, speaks softly, and Pip chooses her — jumping into her hoodie pocket
    with a happy flame-sneeze.
  ever_since_then: Clara and Pip are best friends. Clara still yells "BEAUTIFUL!" at sparkly things —
    but now she remembers to listen first.
