  prompt_style_block: "bright Pokemon anime-style children's book illustration, clean bold ink lines, cel-shaded with soft gradients, big expressive eyes, sunny sky lighting with pink sunset rim light, fluffy clouds, sparkling magic effects, vibrant pastel palette, full-bleed, no text, no watermark"
