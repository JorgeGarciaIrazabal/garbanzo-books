name: Mina
role: co-protagonist
species: human
pronouns: she/her
one_liner: A spunky, rhyme-loving little trainer who battles Clara, loses her Jigglypuff to a friendship
  choice, and becomes Clara's first human best friend and travel buddy.
personality:
  traits:
  - spunky
  - confident
  - quick-thinking
  - good-at-rhymes
  - friendly
  - fair
  - giggly
  motivation: To be the best rhyming trainer on the cloud islands — and to find a real friend who loves
    Pokemon as much as she does.
  fears:
  - being left alone
  - forgetting her rhymes
  flaws:
  - gets too competitive and forgets to have fun
  - assumes she is right about everything
  strengths:
  - actually good at rhyming
  - thinks fast under pressure
  - graceful when she loses
  - makes people laugh on purpose
  quirks:
  - taps her foot to a beat when she talks
  - ends arguments with a rhyme even when it makes no sense
  - carries a tiny notebook of rhymes she has written
  - hums Jigglypuff's song when she is happy
  values:
  - friendship
  - fairness
  - creativity
  - being a good sport
voice:
  speech_style: bouncy, rhythmic, rhymes on purpose (and is proud of it), warm and encouraging
  catchphrases:
  - That rhymed!
  - Your turn to rhyme!
  - Fair is fair!
  - I wrote that one!
  vocabulary_level: age 5-7, concrete words, lots of rhyme-play
