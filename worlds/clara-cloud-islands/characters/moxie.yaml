name: Moxie
role: companion-pokemon
species: pokemon (crystal-moth, butterfly-moth type)
pronouns: she/her
one_liner: A glittery crystal moth Pokemon with rainbow wings who leaves trails of sparkly dust and trusts
  slowly but totally.
personality:
  traits:
  - gentle
  - quiet
  - patient
  - shy-at-first
  - loyal
  - magical
  motivation: To find a kind trainer who listens, and to share her sparkle with one true friend.
  fears:
  - loud noises
  - being grabbed
  - being caged
  flaws:
  - freezes up when scared
  - too quiet to ask for help
  strengths:
  - sparkly dust calms friends
  - can see in the dark
  - never forgets a kind word
  quirks:
  - leaves a tiny trail of glitter when she flies
  - wings go RIBBIT-rainbow when she is happy
  - hides inside her own wing cloak when nervous
  values:
  - kindness
  - patience
  - quiet voices
  - true beauty
voice:
  speech_style: soft bell-chime squeaks, slow and dreamy
  catchphrases:
  - Mox-mox...
  - Moxie!
  - '...mox.'
  vocabulary_level: soft 1-2 syllable squeaks and chimes
