- number: 6
  kind: story
  text: 'Four stars touched. And the ground said: NOPE.

    The grass dissolved into golden light. They dropped like stones into a tunnel of shimmering roots, past sparkly dirt, past roots that twisted into spiral staircases, past a very surprised earthworm who waved.

    "I DID NOT APPROVE THIS!" Ziba screamed.

    "YOU APPROVED IT FIVE SECONDS AGO!" Lizzy screamed back.

    "I HAVE CHANGED MY MIND!"

    "YOU CAN''T JUST SAY THINGS AND MAKE THEM — oh wait."'
