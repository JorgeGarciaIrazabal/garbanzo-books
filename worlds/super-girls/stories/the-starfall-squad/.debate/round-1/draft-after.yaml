- number: 12
  kind: story
  text: '"My turn!" Lizzy bounced forward. She wanted to know. She always, ALWAYS wanted to know.

    She held out her palm. She thought about every question she''d ever had.

    A lantern appeared. Lavender and silver. It glowed with pure starlight.

    The beam shot out — sharp, focused, powerful — and landed on exactly one thing.

    A pinecone.

    "SCIENTIFIC BREAKTHROUGH!" Lizzy shouted. "THIS PINECONE EXISTS!"

    "We could see the pinecone," said Clara. "With our eyes."

    "BUT NOW WE KNOW."'
