- number: 19
  kind: story
  text: 'The Dreaming went silent. The humming candy-trees stopped. The pillow-hills held their breath. The cocoa river froze mid-bubble.

    And the shape began to RISE.

    Bigger than a building. Bigger than a mountain. Its back curved against the stars.

    The green eyes found them. And FOCUSED.

    Clara''s wrist blazed. Then Lizzy''s. Then Catalina''s and Ziba''s. Four stars burning like tiny suns.

    "It sees us," Catalina whispered.

    "Yes," said Barnaby. "Yes it does."'
