  text: '"Wake up," said Barnaby.

    "What?"

    "WAKE UP! You''re dreaming! Think about waking up and you''ll go back!"

    Clara grabbed everyone''s hands. "ON THREE. Think about your bed. Your pillow. Your blanket. THREE —"

