- number: 17
  kind: story
  text: 'They followed the lantern beam.

    Through candy forests where the trees hummed. Past pillow-hills where dream-butterflies slept in piles. Over a wobbly bridge made of crayons.

    The beam got brighter. Straighter. More urgent.

    "Whatever it is," Lizzy said, "it''s BIG. And old. And —"

    The beam STOPPED. It lit up something on the horizon. Something dark. Something that moved.

    And then the something opened its eyes.'
