- number: 24
  kind: story
  text: 'Clara opened her eyes. Her bedroom. Morning sun. Normal ceiling. Normal bed.

    She looked at her wrist. The star was still there. Brighter than before. Cracked right down the middle of the small golden scar where the shield had split.

    On her pillow: a single sparkly dream-feather. Cream and gold.

    It wasn''t a dream.

    It had never been a dream.

    And somewhere in the dark, two green eyes were still open.'
