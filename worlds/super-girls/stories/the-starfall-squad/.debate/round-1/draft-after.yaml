- number: 9
  kind: story
  text: '"Over here," Barnaby announced, "is the legendary Cloud of Destiny!"

    It was a cloud. A normal cloud. Just floating.

    "That looks like a normal cloud," said Clara.

    "It is a VERY important normal cloud," said Barnaby. He turned to point the other way and walked directly into a candy-cane tree. It snapped.

    "...the famous Broken Candy Cane Tree," he said from the ground. "Which I just invented."

    "This is our guide," Lizzy wrote. "We are doomed."'
