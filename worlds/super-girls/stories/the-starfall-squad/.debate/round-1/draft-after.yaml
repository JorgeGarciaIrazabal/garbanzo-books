- number: 16
  kind: story
  text: 'Once Catalina was free (Sprout was fine, she checked), Clara called a meeting.

    "Okay. Try again. For real."

    She thought about her friends. The potato-shield flickered and GREW. Not huge. Serving-bowl sized. Real. Kind-of-usable.

    "I have upgraded from potato to bowl," she said. "I am unstoppable."

    Lizzy concentrated. Not on objects. On feelings.

    Her lantern beam went soft. It pointed toward something far away. Something that felt... sad.

    "There''s something out there," she whispered.'
