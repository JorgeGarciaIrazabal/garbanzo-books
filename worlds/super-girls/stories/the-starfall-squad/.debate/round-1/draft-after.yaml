- number: 4
  kind: interaction
  text: 'At school, things got weirder.

    Lizzy was wearing a single winter glove. Inside. "Just cold," she said. "I''m very cold. On one hand. Specifically."

    Catalina had wrapped her wrist in a scarf. It was 75 degrees outside.

    Ziba had drawn a bracelet over hers with marker. A very elaborate bracelet. With flames and a dragon.

    "Cool bracelet," said Clara.

    "Thanks I drew it to cover the glowing star on my wrist," said Ziba.

    Long pause. "YOU TOO?!"'
