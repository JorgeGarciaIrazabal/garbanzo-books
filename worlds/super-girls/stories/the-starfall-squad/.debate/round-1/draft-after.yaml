- number: 11
  kind: story
  text: 'Clara scrunched up her whole face. She thought about her friends. About being strong. About never letting anything hurt them.

    Her wrist blazed. Golden light burst from her palm. It formed into a shield. Bright. Glowing. Radiant.

    And absolutely TINY. The size of a potato.

    A long silence.

    "...I can block a grape?" Clara said.

    "GRAPES ARE VERY DANGEROUS," Barnaby said. "In some cultures."

    Clara stared at her potato-shield. "I want a refund."'
