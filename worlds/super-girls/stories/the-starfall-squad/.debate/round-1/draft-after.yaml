spine:
  once_upon_a_time: In the town of Maplewood, four best friends — Clara, Lizzy, Catalina, and Ziba — were perfectly ordinary first-graders with exactly zero superpowers. So far.
  every_day: They walked to school. They shared snacks. They argued about whether a hot dog is a sandwich. (It is NOT. Clara declared. Case closed. Lizzy immediately reopened the case.)
  until_one_day: All four woke up with tiny glowing star-marks on their wrists. At recess, when they touched their stars together under the oak tree, the ground opened up and swallowed them whole.
  because_of_that:
  - They landed in the Dreaming — a world of crayon cities, pillow-clouds, and candy-cane trees — directly on top of a chubby owl-rabbit who immediately declared himself their 'Starlight Guide.' His name was Barnaby. He was lying.
  - One by one, each girl discovered her power. Each discovery was a spectacular disaster: Clara's golden shield was the size of a potato. Lizzy's lantern lit up a pinecone. Catalina's vines tied her to a tree. Ziba's illusions were fifteen very confused chickens.
  - Barnaby gave them a tour. He got lost three times, walked into a candy-cane tree, and announced a perfectly ordinary cloud was 'the legendary Cloud of Destiny.' Then he led them somewhere he should not have led them.
  - Two enormous green eyes opened on the horizon. The Dreaming went silent. The girls' stars blazed like tiny suns.
  - The girls tried to wake up. The stars went dim. The eyes got closer. Waking up was not an option.
  until_finally: The girls used their powers for the first time for real. Clara's shield cracked but held. Catalina's vines became a net. Ziba's last chicken — Junior — panicked straight into the ancient being's nostril. It sneezed. The sneeze blew them awake.
  ever_since_then: The girls woke up in their own beds. Their stars were still there, glowing brighter than ever. There was a sparkly dream-feather on every pillow. Barnaby was not on any pillow, which was a relief. That night, under the oak tree, a new sound was waiting in the dark. The eyes were not done with them.
