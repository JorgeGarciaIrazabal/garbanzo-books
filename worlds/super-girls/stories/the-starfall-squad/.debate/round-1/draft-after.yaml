- number: 1
  kind: story
  text: 'Clara, Lizzy, Catalina, and Ziba.

    The boss. The brain. The heart. The wild card.

    They walked to school together every morning. They shared snacks at lunch. They did homework at Catalina''s house (Gerald the fern supervised). They argued about crayons. They argued about who was faster. They argued about whether a hot dog is a sandwich.

    It is NOT, Clara declared. Case closed. Lizzy immediately reopened the case.'
