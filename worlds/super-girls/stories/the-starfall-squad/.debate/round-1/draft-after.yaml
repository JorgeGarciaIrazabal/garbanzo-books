  kind: story
  text: '"We have to DO something," Lizzy whispered.

    Clara stepped forward. The bowl-sized shield. "I''m not big enough. I''m not STRONG enough."

    She thought about her friends. About losing them.

    The shield blazed. CRACKED. Held. Blazed again — bigger, brighter, almost the size of a door.

    The green eyes blinked. Just once.

    "Um," said Barnaby. "I think you made it ANGRY."'
