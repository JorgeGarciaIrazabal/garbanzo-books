  text: '"Welcome," said Barnaby, "to the DREAMING."

    Purple-pink-gold sky. Hills made of pillows. Candy-cane trees. A cocoa river with marshmallow stepping stones.

    "There''s a COCOA RIVER," Catalina whispered.

    "There''s always a cocoa river," said Barnaby. "Be impressed."

    Lizzy was already taking notes.'
