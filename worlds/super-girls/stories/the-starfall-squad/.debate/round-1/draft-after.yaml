- number: 5
  kind: story
  text: 'Recess. The giant oak tree. Their spot.

    "What IS this?" Lizzy was practically vibrating. "Is it contagious? Is it aliens? Is it contagious aliens?"

    "You can''t just SAY things and make them real," said Clara.

    "The star glowed through your band-aid," said Lizzy. "Reality is flexible right now."

    "What if we touched them together?" said Clara.

    "That seems scientifically reckless," said Lizzy.

    "I WANT TO DO THE RECKLESS THING," said Ziba.

    They did the reckless thing.'
