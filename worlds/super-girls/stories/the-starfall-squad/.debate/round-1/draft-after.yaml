- number: 7
  kind: story
  text: 'They landed. On something fluffy.

    "MY DIGNITY!" said the fluffy thing.

    It untangled itself. Owl face. Rabbit ears. Round fuzzy body. A star patch on its chest — upside-down and crooked, stitched by someone who had maybe never held a needle.

    "I am BARNABY," it announced. "Your Starlight Guide! I have been expecting you!"

    "We fell through a hole in the ground," said Lizzy.

    "Exactly! And I was HERE! Expecting!"

    One ear flopped. "For approximately the last six seconds."'
