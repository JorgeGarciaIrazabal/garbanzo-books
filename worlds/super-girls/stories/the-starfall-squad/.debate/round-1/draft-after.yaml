- number: 25
  kind: story
  text: 'That night. The oak tree. Midnight.

    All four girls snuck out. One by one, they slipped through their windows and ran through the dark to their tree.

    Barnaby was already there. He was sitting in the tire swing, holding a thermos of cocoa, trying very hard to look like he had not just been sneezed across the universe.

    Junior was back on his ear. Looking smug.

    "You came," Barnaby said.

    "Of course we came," said Clara. "Now explain. Everything."

    "Junior is a mystery I cannot solve," said Barnaby.'
