- number: 22
  kind: story
  text: 'The ancient being leaned down. A single green eye, big as a house, swung toward them.

    A breath. Cold. So cold the candy-trees went white. The pillow-hills crusted with frost. The cocoa river froze solid.

    Catalina threw out her vines — for the first time on purpose, a great green net, flung wide, snaring the four girls and yanking them UP into the candy-trees just as a giant green eyelid swept the ground where they''d been standing.

    Junior the chicken, who had been cowering on Barnaby''s ear, was flung clear by the wind. He flapped. He panicked. He flew straight up the ancient being''s nostril.'
