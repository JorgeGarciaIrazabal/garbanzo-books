slug: the-starfall-squad
world: super-girls
title: The Starfall Squad
logline: Four ordinary first-graders fall into a dream-world, get saddled with a clueless owl-rabbit 'guide,' discover their powers in the most embarrassing way possible — and then something in the Dreaming notices them right back.
summary: 'The origin story, told tighter: Clara, Lizzy, Catalina, and Ziba wake up with mysterious star-marks, tumble into the Dreaming, and meet Barnaby — a chubby owl-rabbit who claims to be their Starlight Guide. One by one they discover their powers, each with a spectacularly funny failure. But the Dreaming has older residents, and the girls'' first attempt to wake up fails. They have to actually use their powers to escape — and one of them, accidentally, is Barnaby.'
dedication: For Luna — may you always find the starlight in your dreams.
