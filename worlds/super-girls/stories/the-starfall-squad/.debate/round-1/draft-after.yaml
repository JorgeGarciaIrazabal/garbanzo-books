- number: 2
  kind: story
  text: 'Every night. The same bad dream.

    Clara dreamed she was trying to protect someone and couldn''t move.

    Lizzy dreamed the answers were on a wall, in a language she couldn''t read.

    Catalina dreamed her plants were wilting and no water helped.

    Ziba dreamed everything was gray. No colors. No sparkles. Just gray.

    And in every dream? A shadow. Big. Dark. Watching from the corner.'
