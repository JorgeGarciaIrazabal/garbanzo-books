- number: 13
  kind: story
  text: 'Catalina took a slow breath. She thought about Gerald. About little Sprout in her pocket. About how much she wanted things to GROW.

    Green sparkles flickered at her fingertips. Vines! Beautiful curling green vines burst from her hands!

    They twisted through the air — and grabbed the nearest thing.

    Which was Catalina.

    Three seconds later she was tied to a candy-cane tree, only her calm face visible.

    "I am experiencing a minor setback," she said.

    "MODERN ART!" Barnaby announced. "Very cutting edge!"'
