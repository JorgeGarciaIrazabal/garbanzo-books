- number: 18
  kind: story
  text: 'Two eyes. Green as bottle glass. Big as houses. Opening slowly at the edge of the Dreaming.

    Junior turned completely invisible. He had decided this was above his pay grade.

    "Ah," said Barnaby. The word was very small. "That."

    "THAT?!" Clara''s voice cracked. "WHAT is THAT?!"

    Barnaby''s ears both drooped. "Residents. Old ones. Very old. Very big."

    "YOU KNEW?"

    "I maybe forgot. At the beginning. Definitely at the beginning."'
