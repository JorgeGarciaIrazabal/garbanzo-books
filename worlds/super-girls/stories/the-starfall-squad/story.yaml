- number: 25
  kind: story
  text: 'WHOOSH.


    Clara opened her eyes. Her bedroom. Morning sun. Normal ceiling. Normal bed.


    She looked at her wrist.


    The star was still there. Brighter than before.


    So was something else.


    On her pillow: a single sparkly dream-feather. Cream and gold.


    Across town, Lizzy found one on her pillow too. In her plant-filled room, Catalina held hers up to the light. In her blanket castle, Ziba immediately taped hers into her sketchbook.


    It wasn''t a dream.


    It had never been a dream.'
