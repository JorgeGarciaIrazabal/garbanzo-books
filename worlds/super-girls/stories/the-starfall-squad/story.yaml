- number: 24
  kind: story
  text: '''Wake up.''


    ''What?''


    ''WAKE UP!'' Barnaby shouted. ''You''re dreaming! Think about waking up and you''ll go back!''


    ''That''s your plan?!'' Clara yelled.


    ''It is a VERY ELEGANT plan! The elegance is in the simplicity!''


    The green eyes were getting closer. A sound rolled across the Dreaming like thunder wrapped in velvet.


    Clara grabbed everyone''s hands.


    ''ON THREE. THINK ABOUT YOUR BED. Your pillow. Your blanket. THREE —''


    The world turned gold.


    Everyone thought about waking up.


    Very hard.'
