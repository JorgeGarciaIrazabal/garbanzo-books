slug: the-starfall-squad
world: super-girls
title: The Starfall Squad
logline: Four ordinary first-graders fall into a dream-world, get saddled with a clueless owl-rabbit 'guide,' and discover their superpowers in the most embarrassing way possible — and then something much
  bigger notices them.
summary: 'The origin story: Clara, Lizzy, Catalina, and Ziba wake up with mysterious star-marks, tumble into the Dreaming, and meet Barnaby — a chubby owl-rabbit who claims to be their Starlight Guide.
  One by one they discover their powers, each with a spectacularly funny failure. But just as they start to get the hang of it, something enormous stirs in the depths of the Dreaming... and it''s noticed
  them.'
dedication: For Luna — may you always find the starlight in your dreams.
