spine:
  once_upon_a_time: In the town of Maplewood, four best friends — Clara, Lizzy, Catalina, and Ziba — were perfectly ordinary first-graders. They shared snacks, swapped secrets, and had exactly zero superpowers.
    So far.
  every_day: Every morning they met under the giant oak tree. Every afternoon they did homework together. Every night they went to sleep in their own beds — normal, boring, nothing weird.
  until_one_day: One morning, all four woke up with tiny glowing star-marks on their wrists. They didn't ask for them. They didn't know what they meant. But at recess, when they touched their stars together
    under the oak tree — the ground opened up and swallowed them whole.
  because_of_that:
  - They landed in the Dreaming — a world made of crayon cities, pillow-clouds, and candy-cane trees — directly on top of a chubby owl-rabbit who immediately declared himself their 'Starlight Guide.' His
    name was Barnaby. His qualifications were unclear.
  - Barnaby gave them a tour of the Dreaming — or tried to. He got lost three times, sat on a candy-cane tree (it broke), and insisted a perfectly ordinary cloud was 'the legendary Cloud of Destiny.' The
    girls were not impressed.
  - One by one, each girl discovered her power — and each discovery was a spectacular disaster. Clara summoned a golden shield the size of a potato. Lizzy's lantern lit up a pinecone. Catalina's vines tied
    her to a tree. Ziba conjured fifteen very confused chickens that immediately attacked Barnaby.
  - After the chaos, they regrouped. Clara used her tiny shield to cut Catalina free. Lizzy realized her lantern could sense things, not just light them up. Catalina's vines started behaving. Ziba... still
    had one chicken on Barnaby's ear. It refused to leave.
  - Just as they started to feel like maybe they could do this — the whole Dreaming went quiet. Something massive moved in the distance. Something with eyes like twin moons.
  until_finally: Barnaby went pale. 'Ah. That. I was... definitely going to mention that.' The enormous ancient being rose from the depths of the Dreaming. The girls' stars blazed. Barnaby's only plan was
    'wake up!' — and somehow, it worked.
  ever_since_then: The girls woke up in their own beds. The star-marks were still there, glowing brighter than ever. Dream-feathers lay on every pillow. That night, under the oak tree, Barnaby was waiting
    with cocoa and a very unconvincing smile. 'So... about tomorrow night. There MAY be a few things I forgot to explain.'
