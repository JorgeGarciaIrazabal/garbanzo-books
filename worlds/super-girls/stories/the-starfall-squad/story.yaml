  text: 'This is Lizzy.


    She has questions. SO many questions.


    Why is the sky blue? Why does toast land butter-side down? Why does Clara always get the last cookie?


    The answer to most of her questions is ''Lizzy, please, it''s 7 AM.''


    She carries a notebook everywhere. She writes down EVERYTHING.


    Including things she already wrote down. Just in case.'
