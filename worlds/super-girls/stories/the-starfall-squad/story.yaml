- number: 29
  kind: end
  text: 'There was a long, long silence.


    ''So let me get this straight,'' said Ziba, pulling out her sketchbook. ''We have four incredibly embarrassing powers. Our guide is an owl-rabbit who forgot to mention the ancient dream-monsters. And
    something with green eyes the size of a school bus just rang OUR doorbell.''


    ''That''s... not inaccurate,'' said Barnaby.


    Clara stood up. Feet planted. Arms crossed. Captain stance.


    ''Then we''d better get good at this.''


    Her wrist blazed. The shield flickered at her fingertips, and this time —


    it was the size of a DOOR.


    Golden. Glowing. Solid.


    Nobody said anything for a long moment.


    Then, one at a time, everyone smiled.


    ~ The adventure is just beginning ~'
