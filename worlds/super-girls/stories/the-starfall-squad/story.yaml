- number: 27
  kind: story
  text: 'That night. The oak tree. Midnight.


    All four girls snuck out. One by one, they slipped through their windows and ran through the dark to their tree.


    Barnaby was already there.


    He was sitting in the tire swing, holding a thermos of cocoa, trying very hard to look like he hadn''t been worried.


    (He had finished most of the cocoa from stress.)


    Junior the chicken was back, perched on his ear, looking smug.


    ''You came,'' Barnaby said.


    ''Of course we came,'' said Clara. ''Now explain. Everything. The Dreaming. The eyes. Why there was a chicken.''


    ''Junior is a mystery I cannot solve.'''
