- number: 13
  kind: story
  text: 'Barnaby decided to give them a tour.


    ''Over here,'' he announced, ''is the legendary Cloud of Destiny!''


    It was a cloud. A normal cloud. Just... floating.


    ''That looks like a normal cloud,'' said Clara.


    ''It is a VERY important normal cloud,'' said Barnaby. ''Also, to your left —''


    He walked directly into a candy-cane tree.


    It snapped.


    ''...the famous Broken Candy Cane Tree,'' he said from the ground. ''Which I just invented.''


    ''This is our guide,'' Lizzy wrote in her notebook. ''We are doomed.'''
