  text: 'This is Clara.


    She has a plan. She ALWAYS has a plan.


    The plan might be terrible. But it''s a plan.


    She is six years old. She stands like a tiny army general. Feet wide. Arms crossed. Face that says ''I''m in charge, don''t ask questions.''


    Everyone asks questions anyway.


    Clara does not appreciate this.'
