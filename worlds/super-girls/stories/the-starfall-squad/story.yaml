- number: 17
  kind: story
  text: 'Catalina took a slow breath. She thought about her garden. About Gerald. About little Sprout, whose tiny pot was still in her pocket.


    She thought about how much she wanted things to GROW. To be strong. To reach for the sun.


    Green sparkles flickered at her fingertips.


    Vines! Beautiful curling green vines burst from her hands!


    They twisted through the air — and grabbed the nearest thing.


    Which was Catalina.


    Three seconds later she was tied to a candy-cane tree, wrapped from shoulders to knees, only her calm face visible.


    ''I am experiencing a minor setback,'' she said.


    ''MODERN ART!'' Barnaby announced. ''Very cutting edge!'''
