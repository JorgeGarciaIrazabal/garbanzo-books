- number: 19
  kind: story
  text: 'It took a while to sort things out.


    Ziba tried to un-chicken her chickens. Most vanished. One didn''t. It hid behind Barnaby''s left ear and refused to leave.


    ''I''ll call you Gerald Junior,'' Catalina said to the chicken from inside her vine cocoon. ''Junior'' for short. Junior clucked.


    Clara used her tiny potato-shield to saw Catalina free. It took six minutes and the shield made a squeaky noise.


    ''I have a squeaky weapon,'' Clara said.


    ''Intimidation through tiny sounds!'' Barnaby said. ''Brilliant!''


    ''That''s not a thing.''


    ''It is NOW. I invented it.'''
