- number: 20
  kind: story
  text: 'Once Catalina was free (and had checked that Sprout in her pocket was okay — he was), Clara called a meeting.


    ''Okay. Let''s try again. For real this time.''


    She thought about her friends. About keeping them safe.


    The potato-shield flickered and GREW. Not huge. But bigger. Serving-bowl sized. A real, actual, kind-of-usable shield.


    ''I have upgraded from potato to bowl,'' she said. ''I am unstoppable.''


    Lizzy concentrated. Not on objects. On feelings.


    Her lantern beam went soft. It pointed toward something far away — something that felt... sad.


    ''There''s something out there,'' she whispered.'
