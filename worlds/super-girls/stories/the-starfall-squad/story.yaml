- number: 4
  kind: story
  text: 'And this is Ziba.


    She is an ARTIST.


    She draws on paper. She draws on her desk. She once drew a masterpiece on Clara''s homework by accident and Clara was SO MAD but also it was really good.


    Yesterday she drew a curly mustache on her own face with marker. It''s still there. Today she added a monocle.


    She narrates her own life out loud. ''Ziba opened the door. Ziba tripped on nothing. Ziba is fine.'''
