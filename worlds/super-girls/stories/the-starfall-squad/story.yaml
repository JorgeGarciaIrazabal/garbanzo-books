- number: 10
  kind: story
  text: 'Four stars touched.


    And the ground said: NOPE.


    The grass under their feet dissolved into golden light. They dropped like stones into a tunnel of shimmering roots, past layers of sparkly dirt, past roots that twisted into spiral staircases, past
    a very surprised earthworm who waved.


    ''I DID NOT APPROVE THIS!'' Ziba screamed.


    ''YOU APPROVED IT FIVE SECONDS AGO!'' Lizzy screamed back.


    ''I HAVE CHANGED MY MIND!''


    ''YOU CAN''T JUST SAY THINGS AND MAKE THEM — oh wait.'''
