- number: 14
  kind: story
  text: 'After the tour (which involved Barnaby getting lost three times, sitting on a dream-mushroom that was NOT happy, and accidentally drinking from the cocoa river — ''As the ancients say... slurp
    first, ask questions later''), they arrived at a clearing.


    ''RIGHT,'' said Barnaby, cocoa dripping from his beak. ''The important part.''


    He tried to look serious. The cocoa drip was not helping.


    ''The Starlight Spirits chose you because each of you has a power. A gift. Inside you.''


    ''Like... in my stomach?'' asked Ziba.


    ''More... soul-adjacent,'' said Barnaby. ''Clara! You first!'''
