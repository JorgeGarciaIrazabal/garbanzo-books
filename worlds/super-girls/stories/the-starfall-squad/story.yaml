- number: 11
  kind: story
  text: 'They landed.


    On something fluffy.


    ''MY DIGNITY!'' said the fluffy thing.


    It untangled itself. Owl face. Rabbit ears. Round fuzzy body like a very proud cotton ball. A star patch on its chest — upside-down and crooked, stitched by someone who had maybe never held a needle
    before.


    ''I am BARNABY,'' it announced, puffing up. ''Your Starlight Guide! I have been expecting you!''


    ''We fell through a hole in the ground,'' said Lizzy.


    ''Exactly! And I was HERE! Expecting!''


    One ear flopped.


    ''...for approximately the last six seconds.'''
