- number: 5
  kind: story
  text: 'Now here they are together.


    The boss. The brain. The heart. The wild card.


    They walked to Maplewood Elementary every morning. They shared snacks at lunch. They did homework at Catalina''s house (Gerald the fern supervised).


    They argued about crayons. They argued about who was faster. They argued about whether a hot dog is a sandwich.


    (It is NOT, Clara declared. Case closed. Lizzy immediately opened the case again.)


    There was only one weird thing.'
