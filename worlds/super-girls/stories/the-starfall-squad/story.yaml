- number: 28
  kind: story
  text: 'Barnaby took a deep breath.


    ''The Dreaming is... bigger than I said. It''s the place where every dream that''s ever been dreamed still lives. The good ones. The bad ones. The weird ones where you''re a banana playing chess.''


    ''I''ve had that dream,'' said Ziba.


    ''Everyone has,'' said Barnaby. ''But it''s also where the OLD dreams live. Before humans. Before anything. Ancient dreams. Dreams with TEETH.''


    ''And the thing with the green eyes?'' Lizzy asked.


    Barnaby''s ears drooped. ''One of them. And it woke up because of YOU. Your stars — they''re like... a doorbell.'''
