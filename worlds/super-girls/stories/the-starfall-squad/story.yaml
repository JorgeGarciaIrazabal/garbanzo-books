- number: 7
  kind: story
  text: 'Then came the Tuesday that changed everything.


    Clara woke up and her wrist was GLOWING.


    A tiny gold star. Right there. On her actual skin.


    She scrubbed it with soap. Nothing.


    She tried a washcloth. Nothing.


    She put a band-aid over it.


    The star glowed straight THROUGH the band-aid.


    Clara stared at herself in the mirror.


    ''Okay,'' she said. ''Weird. But I can handle weird.'''
