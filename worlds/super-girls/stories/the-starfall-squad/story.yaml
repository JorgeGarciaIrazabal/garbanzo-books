- number: 18
  kind: interaction
  text: '''OKAY! EVERYBODY WATCH!'' Ziba was already crackling with pink and gold sparks.


    She threw her hands to the sky.


    ''I''m going to make,'' she announced, ''the most TERRIFYING monster in the history of IMAGINATION.''


    Color exploded from her palms.


    A shape appeared. Another. Another.


    They were... chickens.


    Fifteen sparkly, translucent chickens. Very confused. Very sparkly.


    One pecked Barnaby on the beak.


    Another sat on his head.


    A third began chasing its own tail.


    ''THE CHICKENS ARE AGGRESSIVE!'' Lizzy shouted, writing furiously. ''Also they sparkle!'''
