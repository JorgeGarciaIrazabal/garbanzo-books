- number: 21
  kind: story
  text: 'They followed the lantern beam.


    Through candy forests where the trees hummed. Past pillow-hills where dream-butterflies slept in piles. Over a bridge made of crayons that wobbled alarmingly.


    The beam got brighter. Straighter. More urgent.


    ''Whatever it is,'' Lizzy said, ''it''s BIG. And old. And —''


    The lantern beam STOPPED.


    It lit up something on the horizon.


    Something dark.


    Something that moved.


    And then the something opened its eyes.'
