- number: 12
  kind: interaction
  text: '''Welcome,'' said Barnaby, spreading his tiny useless wings dramatically, ''to the DREAMING.''


    The girls looked around. They had been so busy falling (and landing on Barnaby) that they hadn''t really SEEN.


    The sky was purple and pink and gold all at once. The trees were made of candy canes. The hills were actual pillows. Rivers of warm cocoa flowed between them.


    ''There''s a COCOA RIVER,'' Catalina whispered.


    ''There''s always a cocoa river,'' said Barnaby. ''It''s a dream world. Be impressed.''


    Lizzy was already taking notes. ''Cocoa river. Temperature unknown. Taste test required.'''
