  text: 'This is Catalina.


    She is the kindest person in the entire first grade. Maybe the entire world.


    She talks to her plants. She has names for all of them.


    There''s Gerald (a fern). Beatrice (a cactus that she apologizes to when she bumps it). And Sprout — a tiny green thing in a tiny pot that she carries everywhere.


    Sprout has not done anything yet. But Catalina believes in him.'
