- number: 6
  kind: story
  text: 'Every night. The same bad dream.


    Clara dreamed she was trying to protect someone — but couldn''t move.


    Lizzy dreamed the answers to all her questions were written on a wall... in a language she couldn''t read.


    Catalina dreamed her plants were wilting and no amount of water helped.


    Ziba dreamed everything was gray. No colors. No sparkles. Just gray.


    And in all four dreams? A shadow. Big. Dark. Watching from the corner.


    Every. Single. Night.'
