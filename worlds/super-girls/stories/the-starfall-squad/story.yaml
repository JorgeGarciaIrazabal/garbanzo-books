- number: 23
  kind: story
  text: 'The entire Dreaming went silent.


    The humming candy-trees stopped. The pillow-hills held their breath. The cocoa river froze mid-bubble.


    And the shape on the horizon began to RISE.


    It was bigger than a building. Bigger than a mountain. Its back curved against the stars.


    The green eyes found them.


    And FOCUSED.


    Clara''s wrist blazed. Then Lizzy''s. Then Catalina''s and Ziba''s. All four stars burning like tiny suns.


    ''It sees us,'' Catalina whispered.


    ''Yes,'' said Barnaby. ''Yes it does.''


    ''What do we DO?''


    Barnaby opened his beak. Closed it. Gulped.


    ''...I''m going to suggest something and I need you to not be mad.'''
