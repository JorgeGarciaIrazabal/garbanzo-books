- number: 22
  kind: story
  text: 'Two eyes.


    Green as bottle glass. Big as houses. Opening slowly in the darkness at the edge of the Dreaming.


    The chicken on Barnaby''s ear turned completely invisible. Not sparkly — just GONE. Junior had decided this was above his pay grade.


    ''Ah,'' said Barnaby. The word was very small. ''That.''


    ''That?!'' Clara''s voice cracked. ''WHAT is that?!''


    ''It''s...'' Barnaby''s ears both drooped. ''Something I should have mentioned. Possibly. At the beginning. Definitely at the beginning.''


    ''BARNABY.''


    ''The Dreaming has... residents. Old ones. Very old. Very big. I maybe forgot.'''
