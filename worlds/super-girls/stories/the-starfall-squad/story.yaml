- number: 26
  kind: interaction
  text: 'At school, nobody talked about the bad dream anymore.


    Nobody talked about shadows in the corner.


    But the four girls kept glancing at their wrists. At each other. Then away.


    Something had happened. Something real. And terrifying. And AMAZING.


    During math, Ziba passed Clara a note. It was a drawing.


    Four stick figures with crowns. One round owl-rabbit with a chicken on its ear. And in the corner, two enormous green eyes.


    Underneath she''d written: ''SO. Tomorrow night?''


    Clara looked at the drawing. Then at Lizzy. Then at Catalina.


    She nodded.'
