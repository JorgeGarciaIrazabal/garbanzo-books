slug: clara
world: super-girls
name: Clara
role: protagonist
species: human
pronouns: she/her
one_liner: The brave leader whose courage literally becomes a golden shield — but she sometimes forgets
  that leading doesn't mean deciding everything.
personality:
  traits:
  - brave
  - determined
  - protective
  - bossy
  - loyal
  motivation: To keep her friends safe and make sure everyone gets through the night — even if they wish
    she'd stop telling them what to do.
  fears:
  - letting a friend down
  - not being strong enough
  - the dark (she'll never admit it)
  flaws:
  - takes charge even when nobody asked
  - stubborn — once her shield is up she sometimes blocks help, not just danger
  - hides her own scared feelings so the others don't worry
  strengths:
  - first to step forward when things get scary
  - unshakeable belief in her friends
  - physically fearless in a crisis
  quirks:
  - stands with feet planted wide, arms crossed, even when sitting
  - names her shield (currently calling it 'Goldie')
  - hums marching-band tunes when nervous
  values:
  - courage
  - loyalty
  - justice
voice:
  speech_style: Short, declarative sentences. Sounds like a tiny general — 'Okay team, here's the plan.'
    Often interrupted by her own better judgment.
  catchphrases:
  - I've got this.
  - Nobody left behind.
  - '...okay, new plan.'
  vocabulary_level: confident six-year-old, occasional grown-up words used slightly wrong
appearance:
  age_appearance: 6 years old
  build: sturdy, athletic, stands taller than her friends by an inch
  height: tallest of the four girls
  skin: warm tan
  hair: sleek dark brown chin-length bob with straight bangs, practical and no-fuss
  eyes: steady dark brown, slightly narrow (determined look)
  outfit: gold-trimmed cream denim jacket over a simple cream dress with a star-shaped gold clasp at the
    collar, cream sneakers with gold laces
  distinguishing_features:
  - gold star-shaped hair clip, always perfectly centered on the right side of her bob
  - stands with feet planted wide and arms crossed — her 'captain stance'
  - tiny gold star bracelet on right wrist that glows when adventure calls
  - one stubborn cowlick at the back of her head that never stays flat
  color_palette:
  - part: jacket trim
    hex: '#f4d58a'
  - part: dress
    hex: '#f4e1c1'
  - part: hair
    hex: '#4a3728'
  - part: skin
    hex: '#c4956a'
  - part: sneakers
    hex: '#f4e1c1'
  silhouette_notes: Square-shouldered stance, feet wide apart, bob haircut with visible star clip on right
    side. Looks like a tiny bodyguard from any angle.
