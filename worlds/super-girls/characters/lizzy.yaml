slug: lizzy
world: super-girls
name: Lizzy
role: protagonist
species: human
pronouns: she/her
one_liner: The endlessly curious investigator whose lantern lights up hidden truth — and also every distraction
  along the way.
personality:
  traits:
  - curious
  - clever
  - distractible
  - observant
  - talkative
  motivation: To figure out how everything works — the Night-Mares, the Dreaming, Barnaby's proverbs,
    why toast always lands butter-side down — all of it.
  fears:
  - not knowing the answer
  - being wrong in front of people
  flaws:
  - gets sidetracked by interesting details (a weird dream-mushroom can derail a whole mission)
  - asks 'why?' so many times that Clara sometimes just walks away
  - corrects people's facts mid-crisis
  strengths:
  - notices what everyone else misses — the one clue that solves the puzzle
  - endless optimism — there's always another angle to try
  - remembers everything she's ever read
  quirks:
  - pushes glasses up her nose even when they haven't slipped
  - takes notes on everything, including her own notes
  - mumbles observations under her breath like a tiny detective ('suspect is a blob... very blobby blob')
  values:
  - curiosity
  - truth
  - friendship
voice:
  speech_style: Rapid-fire questions and observations, often three at a time. Lots of 'Did you know...'
    and 'Wait, what about...' Sentences tumble out faster than her brain can organize them.
  catchphrases:
  - Wait wait wait — I see something!
  - Did you know...?
  - Aha! I KNEW it! (even when she just figured it out two seconds ago)
  vocabulary_level: precocious early reader, loves big words and sometimes mispronounces them with total
    confidence
appearance:
  age_appearance: 6 years old
  build: slight, wiry, always in motion
  height: average for age, shorter than Clara
  skin: fair with a constellation of freckles across nose and cheeks
  hair: uncontrollable curly auburn hair piled into a messy bun that's perpetually falling out, with a
    chewed pencil stuck through it
  eyes: hazel-green behind large round glasses with dusk-blue frames
  outfit: lavender-mist cardigan with too-long sleeves over sage-green corduroy overalls, one pocket always
    bulging with a small spiral notebook, mismatched socks (one striped, one polka-dotted)
  distinguishing_features:
  - oversized round glasses with dusk-blue frames that make her eyes look huge
  - auburn messy bun with a pencil stabbed through it — the universal 'thinking hard' signal
  - freckles scattered across nose and cheeks like a star map
  - lavender star bracelet on left wrist, glows when adventure calls
  color_palette:
  - part: cardigan
    hex: '#b8a8d1'
  - part: overalls
    hex: '#6b8f71'
  - part: hair
    hex: '#b85c38'
  - part: glasses frames
    hex: '#3d5a73'
  - part: skin
    hex: '#f5dcc3'
  silhouette_notes: Small, wiry frame, oversized glasses visible in profile, messy bun with pencil sticking
    up. The notebook bulge in her overall pocket is a visible bump in any pose.
