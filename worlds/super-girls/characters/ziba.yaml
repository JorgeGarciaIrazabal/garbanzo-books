slug: ziba
world: super-girls
name: Ziba
role: protagonist
species: human
pronouns: she/her
one_liner: The wild imagination of the squad whose illusions can confuse any monster — when she remembers
  which reality she's supposed to be in.
personality:
  traits:
  - imaginative
  - playful
  - mischievous
  - dramatic
  - big-hearted
  motivation: To make the world (and the Dreaming) more fun, more colorful, and more surprising — boredom
    is the real enemy.
  fears:
  - a world without stories
  - being told her ideas are 'too much'
  flaws:
  - gets so lost in her own imagination she forgets the mission
  - her illusions sometimes get away from her (the giant cupcake was supposed to be a distraction, not...
    real)
  - dramatically announces 'we're doomed!' the moment anything goes slightly wrong
  strengths:
  - limitless creativity — there's always a plan C, D, E, F...
  - her illusions can outsmart monsters who can't tell real from pretend
  - makes even the scariest situations feel like an adventure story they're all writing together
  quirks:
  - carries a sketchbook and draws the monster while it's still mid-chase
  - gives every Night-Mare a silly name before they even fight ('Hello, Sir Fluffy Doomface')
  - narrates her own life in third person when excited ('Ziba crept forward...')
  - one sock is always a different color — on purpose, as 'a fashion statement'
  values:
  - creativity
  - joy
  - self-expression
  - friendship
voice:
  speech_style: Big, theatrical, full of sound effects and dramatic pauses. Tells stories within stories.
    Every sentence has jazz hands energy. Occasionally whispers for no reason.
  catchphrases:
  - Ooh! Ooh! I have an idea!
  - Picture this...
  - Trust the sparkles! (her battle cry, which means nothing and everything)
  vocabulary_level: surprisingly rich vocabulary from reading — uses words like 'magnificent' and 'catastrophe'
    with equal enthusiasm
appearance:
  age_appearance: 6 years old
  build: compact, energetic, never still — dancing even when standing
  height: smallest of the four girls
  skin: deep brown
  hair: big natural hair in two high puffballs with colorful beads (lavender, gold, turquoise) and wrapped
    threads
  eyes: bright warm brown, impossibly wide and sparkling
  outfit: lavender-mist tunic with hand-drawn star designs (she drew them herself with fabric markers),
    star-print leggings, one cream sock and one starlight-gold sock (mismatched on purpose), a mini sketchbook
    on a ribbon around her neck
  distinguishing_features:
  - two high puffballs with colorful beads — the puffballs bounce when she's excited
  - lavender star bracelet on right ankle (she asked the Starlight Spirits to move it there 'for symmetry
    with Catalina')
  - sketchbook on a ribbon around her neck — she whips it out mid-adventure to draw what's happening
  - perpetual paint smudge on cheek or nose
  color_palette:
  - part: tunic
    hex: '#b8a8d1'
  - part: leggings (star print on cream)
    hex: '#f4e1c1'
  - part: hair
    hex: '#2a1f1a'
  - part: skin
    hex: '#5c3a24'
