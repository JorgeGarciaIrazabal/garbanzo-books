    hex: '#f4d58a'
  - part: sketchbook ribbon
    hex: '#f4d58a'
  silhouette_notes: Smallest of the group, unmistakable twin puffball hair shapes with beads visible as
    bumps. Sketchbook on a ribbon creates a distinct shape at chest level. Perpetually mid-bounce.
