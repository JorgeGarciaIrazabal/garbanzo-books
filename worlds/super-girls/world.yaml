geography:
  overview: |
    Maplewood is a sleepy suburban town with tree-lined streets, a little library, a park with
    an ancient oak, and an elementary school where the four girls meet. By night the town
    transforms: rooftops become observation decks, the park's oak grows into the World Tree
    connecting to the Dreaming, and the school's basement hides a portal to the Starlight
    Sanctuary — a cozy pocket dimension where the girls plan missions, share cocoa, and try to
    keep Barnaby from eating the furniture.
  locations:
    - name: Maplewood Elementary
      description: |
        A cheerful brick school with big windows, a playground under a massive oak, and a
        surprisingly spacious basement that holds the secret entrance to the Starlight Sanctuary.
      mood: warm
      recurring: true
    - name: The Girls' Bedrooms
      description: |
        Four distinct rooms connected by a shared dreamscape corridor — Clara's tidy star charts,
        Lizzy's chaotic book fort, Catalina's plant-filled nook, Ziba's blanket-castle studio.
      mood: cozy
      recurring: true
    - name: Starlight Sanctuary
      description: |
        A pocket dimension reached through the school basement — soft glowing walls, floating
        cushions, a cocoa fountain, and walls that show sleeping children's dreams. The girls'
        mission control. Barnaby's nest (a teacup lined with starlight) sits in the corner.
      mood: magical
      recurring: true
    - name: The Dreaming
      description: |
        A luminous, shifting landscape where children's dreams take shape — candy-cane forests,
        pillow-cloud seas, crayon-drawn cities. Night-Mares lurk in the shadowed corners.
        Barnaby knows all the best snack spots.
      mood: wonder
      recurring: true
    - name: The World Tree (Maplewood Park)
      description: |
        By day a grand old oak with a tire swing. By night its roots plunge into the Dreaming and
        its branches hold the Starfall Squad's constellation markers. Barnaby claims the highest
        branch for "strategic observation" (naps).
      mood: mystical
      recurring: true
rules:
  - "The Starfall Squad only activates at night, after all four girls are asleep — their bodies stay in bed while their dream-selves adventure."
  - "Powers are tied to each girl's core trait (courage, curiosity, kindness, imagination) and cannot be swapped or stolen."
  - "Night-Mares are born from children's worries (tests, bullies, the dark, being left out) and dissolve when the underlying worry is soothed or faced — not destroyed by force alone."
  - "The girls must never reveal their secret to waking adults; the magic only works because children believe."
  - "By morning, all physical traces fade (no injuries, no torn clothes), but the star-mark on each wrist glows faintly when a new adventure approaches."
  - "The Starlight Spirits offer guidance but never direct orders — the girls choose how to help."
  - "Barnaby is officially a Starlight Guide. Nobody remembers appointing him. He has no identifiable power except 'being present when things happen' and an uncanny knack for finding snacks."
  - "Barnaby's mangled proverbs ('A stitch in time... makes a nice blanket!') occasionally accidentally solve the puzzle. The girls treat this as wisdom. Barnaby thinks he's helping."
factions:
  - name: Starfall Squad
    description: "The four girls — Clara, Lizzy, Catalina, Ziba — plus Barnaby, guardians of the Dreaming."
    values: "friendship, courage, empathy, creativity, chaos"
  - name: Starlight Spirits
    description: "Ancient, gentle beings who chose the girls and watch from the edge of the Dreaming. They *definitely* meant to send Barnaby. Probably."
    values: "guidance, patience, wonder, plausible deniability"
  - name: Night-Mares
    description: "Fuzzy, shape-shifting creatures born of bedtime worries; scary-looking but not evil. Deeply confused by Barnaby."
    values: "feeding on fear, growing from unspoken worries, avoiding the weird owl-rabbit"
  - name: Maplewood Elementary Fourth Graders
    description: "The 'big kids' who sometimes bully or tease — sources of new Night-Mares."
    values: "status, coolness, secrets"
timeline:
  - label: "The Starlight Spirits awaken and seek four new guardians."
    description: "Before the story begins"
  - label: "Clara, Lizzy, Catalina, and Ziba meet on the first day of kindergarten and become inseparable."
    description: "Two years ago"
  - label: "The first Night-Mare slips into Maplewood; the girls are marked with star-bracelets and enter the Dreaming for the first time. Barnaby introduces himself as their 'Guide.' Nobody asks how he got there."
    description: "Story start (Book 1)"
motifs:
  - "Star-shaped birthmarks/bracelets on wrists — glow when adventure calls"
  - "Cocoa and warm milk — the universal comfort after a night mission (Barnaby drinks the foam)"
  - "The ancient oak / World Tree — bridge between waking and dreaming (Barnaby's favorite nap spot)"
  - "Lost items reappearing in dreams — a homework page becomes a map, a lost sock becomes a sail"
  - "Lullabies hummed backwards — the secret signal to enter the Dreaming"
  - "Pajamas that subtly shift color/pattern to match each girl's power palette"
  - "Barnaby's mangled proverbs — 'The early bird... gets to sleep in!' 'A penny saved... tastes like copper!'"
  - "Barnaby's inexplicable dream-souvenir collection — each book he gains a new oddity"
