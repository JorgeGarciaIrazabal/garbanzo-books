slug: super-girls
title: Super Girls
tagline: "By day they're four ordinary six-year-olds at Maplewood Elementary. By night they're the Starfall Squad — defenders of the dreamworld (with one very unhelpful mascot)."
premise: |
  Clara, Lizzy, Catalina, and Ziba are best friends who share everything — snacks, secrets, and the
  ordinary worries of being six: lost homework, a friend who won't share, the scary shadow in the
  hallway. But when the moon rises over Maplewood, the girls are chosen by the Starlight Spirits to
  become the Starfall Squad, guardians who slip into the Dreaming to protect sleeping children from
  Night-Mares — fuzzy, gloomy creatures born of bedtime worries. Each girl's power reflects her
  heart: Clara's courage shines as a golden shield, Lizzy's curiosity becomes a lantern that
  reveals hidden paths, Catalina's kindness blooms into healing vines, and Ziba's imagination
  conjures playful illusions that confuse and delight monsters.

  Tagging along is **Barnaby** — a supposed "Starlight Guide" who takes the form of a chubby,
  perpetually confused owl-rabbit creature. He speaks in mangled proverbs, gets distracted by
  shiny dream-objects, accidentally sits on the mission map, and somehow *always* claims credit
  when things work out. The girls adore him. The Night-Mares find him baffling. The Starlight
  Spirits pretend they meant to send him.

  By dawn, the adventure fades like a dream — but the friendship, the tiny star-shaped mark on
  each girl's wrist, and Barnaby's inexplicable collection of dream-souvenirs (a candy-cane cane,
  a pillow-cloud feather, a crayon-drawn mustache) remain.
