slug: pip-and-the-hidden-honey
world: magical-forest
title: Pip and the Hidden Honey
logline: Pip drags a nervous Bumble on a hunt for the forest's sweetest hidden honey — but a grumpy toad
  is sitting on it.
summary: When Pip overhears about the sweetest honey in the forest, she has to find it. The Oldest Tree
  gives them a riddle with three clues. Pip races through Pond Place, The Log Shops, and Sunny Field,
  getting into mess after mess — while Bumble worries and grumbles and follows her anyway. But when a
  big grumpy toad blocks the honey, it's Bumble who finds his brave side and saves the day.
