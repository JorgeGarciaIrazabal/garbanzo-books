spine:
  once_upon_a_time: Pip and Bumble live in Berry Homes. Pip wakes up every morning looking for the next
    fun thing. Bumble wakes up every morning looking for a quiet day. They almost never get the same kind
    of day.
  every_day: Pip gets ideas — big ones, small ones, messy ones. Bumble trails behind her, cleaning his
    wings and saying 'Um... Pip, are you sure?' He is almost never sure. But he follows her anyway.
  until_one_day: At The Log Shops, Pip's big ears perk up. The pie seller is talking about the Hidden
    Honey — the sweetest honey in the whole forest! And only the Oldest Tree knows where it is.
  because_of_that:
  - Pip drags Bumble to The Old Trees. The tree hums a slow riddle with three clues. Pip bounces on her
    toes — but the tree will only say it once.
  - Clue one sends them to Pond Place. Pip tries to hop across lily pads to the clue. Splash! Into the
    pond she goes. Bumble sighs and pulls her out by her crinkled wing.
  - Clue two is inside The Log Shops. A muddled beetle shopkeeper holds the next hint — but Pip is in
    such a rush she grabs the wrong thing and they have to start again.
  - Clue three leads to Sunny Field. There it is — a tiny pot of golden honey, glowing in the sun! But
    a big, grumpy toad is planted right on top of it. He will not budge.
  until_finally: Pip shrinks herself tiny to sneak under the toad — but she gets dizzy and pops back to
    size right in front of him! The toad blinks. Bumble takes a deep breath — and buzzes as loud as he
    can, zipping around the toad's head until the big grouch hops away, dizzy himself. Pip grabs the pot.
    'Bumble! You did it!' Bumble is shaking but grinning.
  ever_since_then: Back at Berry Homes, they dip berries in the honey. It really is the sweetest honey
    ever. Pip says 'Best plan ever!' Bumble wipes a sticky spot off his specs and says, 'Um... next time,
    maybe we just ask the bee next door.' Then he grins and takes another berry.
