slug: miras-big-sneeze
world: demo-vocab-world
title: Mira's Big Sneeze
logline: Mira the fox wants to find the perfect quiet spot to read, but her enormous sneezes keep blowing
  everything away.
summary: Mira just wants one peaceful page of her book. But every time she settles down, a tickle in her
  nose builds into a sneeze so big it rearranges the world. The other animals flee, then help her build
  a sneeze-proof nook — and discover the best reading spot was sharing it all along.
