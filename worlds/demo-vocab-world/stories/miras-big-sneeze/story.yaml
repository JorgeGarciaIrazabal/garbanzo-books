spine:
  once_upon_a_time: Mira the fox loved stories more than anything.
  every_day: She carried a little book and looked for the softest, sunniest spot to read.
  until_one_day: A tiny tickle in her nose grew and grew until—AH-CHOO!—her sneeze blew the leaves, the
    laundry, and the ducks clear across the meadow.
  because_of_that:
  - The rabbits hid in their burrows. The birds held onto their nests. Mira tried to hold still, but her
    nose had other plans.
  - Mira built a wall of pillows. It blew away. She tried a cave. It echoed. She tried underwater. The
    fish were not impressed.
  until_finally: Her friends brought a stack of books, a warm blanket, and a bucket of sneeze-cushions.
    Mira read to them, and every sneeze just turned the page.
  ever_since_then: Mira still sneezes. But now she has friends who say 'bless you' and pass the next book.
