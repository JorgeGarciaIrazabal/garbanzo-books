slug: the-moon-that-smiled-upside-down
world: lunaria-crystal
title: The Moon That Smiled Upside Down
logline: Quiet Stella must find her voice to say kind words and bring back the glow of the upside-down
  moon before it fades away forever.
summary: Stella Moonweaver and her tiny black cat Luna live in a tall crystal tower where an upside-down
  moon smiles over the kingdom. Every day they make the moon glow by listening and being kind. But one
  night the moon starts to fade, and Stella must go on a gentle journey to find her brave voice, speak
  her kind words, and bring the light back.
