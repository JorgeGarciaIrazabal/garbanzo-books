spine:
  once_upon_a_time: In a sky full of soft sparkly clouds, a quiet girl named Stella lives in a tall crystal
    tower with her tiny black kitten Luna and a big upside-down moon that smiles.
  every_day: Stella and Luna listen to the world, say kind words, and watch the upside-down moon glow
    bright and gold over everyone.
  until_one_day: One morning, the upside-down moon is not so bright anymore — it is fading, soft and dim.
  because_of_that:
  - Stella and Luna go down the silver stairway to find out why the moon is dim. They walk to the Starlight
    Garden where the starflowers hang low, and Luna listens for a wish.
  - At the Moonwell Pool, a tiny little star from the Cloud Bridge Town is very sad and too shy to say
    why. His star inside has gone quiet.
  until_finally: Stella is scared too, but she remembers that kind words make things glow. She takes a
    deep breath, says kind words to the sad little star, and finds her brave voice for the first time.
  ever_since_then: The upside-down moon glows bright and gold again, Stella knows her voice matters, and
    she and Luna remind everyone that a kind word can light up the whole world.
