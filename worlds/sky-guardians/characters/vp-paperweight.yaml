slug: vp-paperweight
world: sky-guardians
name: VP Paperweight (Bradford "Brad" Sterling III)
role: antagonist
species: human
pronouns: he/him
one_liner: GlobeCorp's Americas Regional VP dispatched to Korea — collects ornamental paperweights, names them, and consults
  them for evil decisions like they're a board of directors. Thinks 'kimchi' is a type of yoga.
personality:
  traits:
  - bureaucratically ruthless
  - deadpan literal-minded
  - surprisingly polite
  - obsessed with metrics
  - genuinely confused by fun
  - superstitious (but calls it "data-driven talisman consultation")
  - culturally clueless in hilarious ways
  motivation: Hit Q3 KPIs for 'Peninsula Asset Utilization' by replacing the Han River with a revenue-optimized aqueous thoroughfare
    and installing atmospheric extraction turbines in Jeju's lava tubes. The jade turtle paperweight says it's a 94% synergy
    play. Also wants to franchise 'Korean BBQ' as 'Seoul Food™ — Optimized Protein Experience.'
  fears:
  - missing a filing deadline
  - unquantifiable joy
  - Clara's 'why?' questions (break their logic loops)
  - Form 27-B rejections
  - the color orange (not in brand guidelines)
  - the jade turtle disagreeing with him
  - accidentally offending local customs (does it constantly)
  flaws:
  - cannot deviate from Corporate Policy even to save their own scheme
  - explains their entire plan in PowerPoint if asked (compliance)
  - defeated by local knowledge they didn't spreadsheet
  - takes 'optimization' literally — tries to optimize laughter into 'periodic joy emissions'
  - whispers to paperweights during meetings; subordinates pretend not to notice
  - pronounces 'Seoul' as 'See-Oh-Ul' and 'Han River' as 'The Han River River'
  strengths:
  - infinite henchmen (contracted, with benefits)
  - legal team on retainer in 147 jurisdictions
  - can summon Form 27-B from thin air
  - immune to guilt (classified as 'inefficiency')
  - paperweight 'council' provides surprisingly effective chaos magic
  - unshakeable confidence in wrong assumptions
  quirks:
  - collects ornamental paperweights — names them, consults them for decisions, carries a different one each day
  - 'current rotation: Jade Turtle (strategy), Crystal Briefcase (aesthetics), Miniature Gavel (history/tradition), Obsidian
    Golf Trophy (protection)'
  - carries a clipboard that's actually a tablet displaying real-time 'synergy metrics'
  - stamps 'APPROVED' on things that don't need approval (trees, clouds, ajumma's tteokbokki)
  - genuinely compliments Clara's research skills before filing a complaint
  - 'tries to use local slang incorrectly: ''This VP is totally down with the K-pop, fam.'''
  - thinks 'chaebol' is a type of cereal
  values:
  - efficiency above all
  - standardization = goodness
  - quarterly growth is a moral imperative
  - compliance is joy
  - 'synergy (mandatory, say it with them: SYN-ER-GY)'
  - the jade turtle is never wrong
voice:
  speech_style: corporate speak weaponized — 'leverage,' 'bandwidth,' 'circle back,' 'low-hanging fruit,' delivered with deadpan
    cheerfulness. Never uses contractions. Refers to themselves in third person as 'This VP.' Whispers aside to paperweight.
    Peppers in painfully wrong local references.
  catchphrases:
  - Per Corporate Policy §44.7...
  - This VP has filed the appropriate paperwork.
  - Synergy requires sacrifice. Mostly yours.
  - Have you considered the ROI of that cloud?
  - This meeting could have been an email. But This VP prefers the theater.
  - The jade turtle concurs. *whisper* Don't argue with the turtle.
  - This VP is crushing it in the local market. *finger guns*
  vocabulary_level: excessive corporate jargon, acronyms, passive voice — funny because it's so wrong for a kids' book villain
appearance:
  age_appearance: early 40s, ageless middle-management energy
  build: rigid, perfect posture, moves like a slide deck transition
  height: average, but looms via presence
  skin: pale, impeccably moisturized (corporate wellness stipend), slight sunburn on neck from 'outdoor team building'
  hair: blond, perfectly styled side part, never a strand out of place
  eyes: blue, behind rectangular horn-rim glasses, expression unreadable
  outfit: identical ill-fitting charcoal polyester suit (#5a5a5a), white shirt, navy clip-on tie (#1a3c6e), rectangular glasses,
    clipboard-tablet, oversized gold Compliance Badge (#e86c00), ornamental paperweight in left hand (rotates)
  distinguishing_features:
  - identical suit across all VPs — the uniform of optimization
  - clipboard that's a tablet showing live 'synergy metrics'
  - oversized gold Compliance Badge
  - rectangular glasses that reflect spreadsheets
  - deadpan expression that never cracks (until Clara breaks their logic)
  - always holding an ornamental paperweight — jade turtle, crystal briefcase, miniature gavel, or obsidian golf trophy
  - wears a 'Seoul' pin upside down
