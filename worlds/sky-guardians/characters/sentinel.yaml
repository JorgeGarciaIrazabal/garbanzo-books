  silhouette_notes: 'CUTE SMALL NON-HUMANOID floating capsule — a rounded white pod the size of a backpack cooler, wider than
    tall, hovering on tiny bottom thrusters, single horizontal cyan visor-slit on the front, halo-ring sensor on top, side
    tool-module bay. NO head, NO human arms, NO human legs, NO human face. Direct foil to Gears: Gears is chunky copper wind-up
    toy with big head and stubby limbs; Sentinel is sleek white hovering pod with no limbs at all. Both small and cute, both
    clearly NOT human-shaped. Clara flies organic; Sentinel floats machine-precise.'
