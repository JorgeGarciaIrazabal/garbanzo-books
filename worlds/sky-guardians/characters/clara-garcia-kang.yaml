slug: clara-garcia-kang
world: sky-guardians
name: Clara Garcia Kang
role: protagonist
species: human
pronouns: she/her
one_liner: A seven-year-old flying genius who narrates life like a nature documentary and saves the world before snack time.
personality:
  traits:
  - fiercely curious
  - quick-witted
  - mischievous
  - observant
  - confident
  motivation: Protect the world's weird, wonderful, un-optimizable places from GlobeCorp's spreadsheets — and have the best
    adventure story to tell at school on Monday.
  fears:
  - being bored
  - grown-ups who don't listen
  - running out of snacks mid-flight
  flaws:
  - acts before thinking (sometimes flies into literal walls)
  - hoards random facts like dragons hoard gold
  - refuses to ask for help until Gears's probability calculator hits 99.9% doom
  strengths:
  - connects dots adults miss (pattern recognition is her real superpower)
  - asks "why?" until bureaucratic logic collapses
  - preps obsessively — knows each country's snacks, landmarks, and secret hideouts before arrival
  quirks:
  - narrates her own life in a hushed David Attenborough whisper ("Here we see the wild Clara approaching the cookie jar...
    note the calculated trajectory.")
  - talks to clouds like they're old friends who owe her gossip
  - draws wing designs on her sneakers with marker (different every book)
  values:
  - curiosity over compliance
  - the weird deserves protection
  - snacks are diplomacy
  - a good story beats a perfect plan
voice:
  speech_style: fast, peppered with questions and nature-doc asides, uses big words correctly then explains them to Gears
  catchphrases:
  - Observe...
  - 'Field note:'
  - Gears, calculate the odds!
  - That's not in the brochure.
  vocabulary_level: age-appropriate but precocious — uses words like 'bureaucracy', 'thoroughfare', 'optimization' and defines
    them mid-sentence
appearance:
  age_appearance: '7'
  build: compact, wiry, always in motion
  height: short for her age (but flies, so irrelevant)
  skin: light, warm peach undertone
  hair: light brown, blunt bangs cut just above eyebrows, practical chin-length bob that never stays tucked behind ears
  eyes: dark brown, bright with mischief, crinkle at corners when she's plotting
  outfit: colorful layered clothes — bright teal hoodie over coral t-shirt, leggings with knee patches, high-top sneakers
    with marker-drawn wings (design changes per adventure), tiny backpack for snacks
  distinguishing_features:
  - blunt bangs that bounce when she flies, never obscure vision
  - sneakers with hand-drawn wings (different design each book)
  - perpetual motion — always mid-leap, perched, or upside-down
  - tiny backpack shaped like a cloud
