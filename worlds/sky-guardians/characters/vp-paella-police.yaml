slug: vp-paella-police
world: sky-guardians
name: Director Armando "Authenticity" Vale
role: antagonist
species: human
pronouns: he/him
one_liner: GlobeCorp's Culinary VP dispatched to Spain — measures socarrat with a ruler, pronounces Valencia
  as "Va-LEN-see-ah," and genuinely believes Instant Powder Kits™ are "globally palatable optimization."
personality:
  traits:
  - bureaucratically ruthless
  - deadpan literal-minded
  - surprisingly polite
  - obsessed with metrics
  - genuinely confused by flavor
  - culturally clueless in hilarious ways
  motivation: Hit Q3 KPIs for 'Iberian Culinary Asset Utilization' by trademarking "paella," eliminating
    the socarrat (crust = inefficiency), and selling Instant Paella Powder Kits™ in fourteen globally
    compliant flavors. The paella pan paperweight says it's a 91% synergy play.
  fears:
  - flavor that cannot be measured
  - abuelas with handwritten recipes
  - pigeons with clipboards
  flaws:
  - cannot deviate from Corporate Policy even to save his own scheme
  - explains his entire plan in PowerPoint if asked (compliance)
  - defeated by local knowledge he didn't spreadsheet
  - takes "optimization" literally — tries to optimize laughter into "periodic joy emissions"
  - pronounces "Valencia" as "Va-LEN-see-ah" and "paella" as "pie-ELL-ah" until the very end
  - whispers to his paella pan paperweight during meetings; subordinates pretend not to notice
  - insists chorizo in paella is "authentic" (it is not)
  strengths:
  - files Form 27-B faster than anyone in the hemisphere
  - can make seventy-three slides about slurry in one night
  - unwavering commitment to "synergy"
  quirks:
  - paella pan paperweight consultant (whispers to it, calls it "data-driven talisman consultation")
  - pronunciation guide in breast pocket (never opened)
  - tie with microscopic paella-pan pattern
  values:
  - efficiency over flavor
  - metrics over memory
  - optimization over joy
voice:
  speech_style: corporate speak weaponized — 'leverage,' 'bandwidth,' 'circle back,' 'low-hanging fruit,'
    'synergy,' 'KPI,' delivered with deadpan cheerfulness. Never uses contractions. Refers to himself
    in third person as 'This VP.' Peppers in painfully wrong local references.
  catchphrases:
  - Per Corporate Policy §12.9...
  - This VP has filed the appropriate paperwork.
  - Synergy requires sacrifice. Mostly yours.
  - Crust is inefficiency.
  - Flavor is a variable. We are eliminating it.
  vocabulary_level: corporate speak weaponized, zero contractions, third-person self-reference
