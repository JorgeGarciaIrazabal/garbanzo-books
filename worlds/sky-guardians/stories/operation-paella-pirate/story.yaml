  stage: base
  role_in_story: antagonist
spine:
  once_upon_a_time: 'Clara Garcia Kang narrates from a Valencia orange grove at dawn -- "Field note: the
    air smells like saffron, wood smoke, and trouble." Gears calculates an 87.3% probability of paella-related
    doom. His antenna wobbles. "Unacceptable," he beeps.'
  every_day: 'GlobeCorp files Form 27-B for culinary optimization before breakfast. Today''s target: paella.
    VP Paella Police arrives with a clipboard, a tape measure, and a pronunciation guide he absolutely
    ignores. He says "Va-LEN-see-ah." The oranges shudder.'
  until_one_day: 'VP Paella Police unveils the PAELLA(TM) OPTIMIZATION INITIATIVE -- trademark the word
    "paella," replace wood fire with "synergy-heated nutrient slurry pods," and sell Instant Paella Powder
    Kits(TM) in fourteen flavors: Original, Mild, Unseasoned Corporate Beige, and eleven varieties of
    "globally compliant" dust.'
  because_of_that:
  - Clara and Gears land in Valencia's Central Market, where mountains of bomba rice gleam like pearls.
    They meet Abuela Carmen, guardian of the true recipe -- handwritten, stained, measured in puñados
    (handfuls). She peers over her glasses. "My paella has socarrat. Your powder has... dust."
  - 'VP Paella Police deploys the SOCARRAT ERADICATION DRONE -- a hovering vacuum that sucks up the prized
    crispy rice bottom. "Crust is inefficiency," he intones, measuring a socarrat with a ruler. Gears
    panics: "Probability of deliciousness preservation: 0.04%! Initiating Panic Protocol 7-Alpha... wait,
    that''s the snack protocol."'
  - 'Clara challenges VP to a PAELLA-OFF. Corporate Policy §12.9: "Disputed culinary claims resolved by
    public cook-off." VP accepts -- he has a MACHINE. Clara has Abuela''s pan (borrowed), Gears''s jury-rigged
    fire control (a toaster, a coat hanger, and a dream), and a bag of bomba rice they "borrowed" from
    a very confused vendor who still has their IOU.'
  - 'The cook-off begins in Plaza de la Virgen. Orange trees shower petals. VP''s machine hums: beep,
    whir, slurry dispensed. Clara cooks LIVE -- sofrito singing, stock ladled, rice scattered like stars,
    NO STIRRING (Gears: "The physics demand stillness! The Maillard reaction requires patience!"). The
    crowd gathers. A pigeon steals VP''s clipboard. He files a complaint against the pigeon.'
  - 'VP''s machine produces... beige discs. Perfectly round. Flavor: cardboard optimism. Clara''s pan
    reveals GOLDEN SOCARRAT -- the crown jewel, the crunchy treasure, the sound of a spoon cracking through
    glory. The crowd gasps. Abuela tastes. Nods once. "This one has alma." VP checks his tablet: "Alma
    is not a KPI. Requesting definition."'
  - 'Clara serves the paella ON THE SPOT -- paper plates, wooden spoons, chaos, joy, saffron-stained fingers.
    VP''s machine clogs on a chorizo chunk he insisted was "authentic" (Abuela: "Sacrilege!"). The trademark
    application is rejected: "Prior art: Abuela Carmen, 1952–present. Also: your machine ate the paperwork."'
  until_finally: VP Paella Police retreats to HQ, pronouncing "paella" correctly for the first time --
    purely by accident. The Instant Powder Kits become very expensive cat litter. Abuela's recipe gets
    a GlobeCorp watermark (she drew a mustache on the logo). Clara and Gears fly home over the Mediterranean,
    paella-stained sneakers dangling -- best souvenir ever.
  ever_since_then: 'GlobeCorp VPs now fear three things: Clara''s "why?", Gears''s worry-loops, and abuelas
    with handwritten recipes. Somewhere in a Valencia market, a pigeon still has VP''s clipboard. It uses
    it to line a very bureaucratic nest.'
