slug: operation-paella-pirate
world: sky-guardians
title: Operation PAELLA-PIRATE
logline: Clara Garcia Kang and her worry-wart robot Gears race to Valencia to stop GlobeCorp's VP Paella
  Police from trademarking "paella" and replacing it with Instant Powder Kits(TM) -- armed only with a
  borrowed pan, a fierce abuela's secret recipe, and Gears's socarrat-detector built from a toaster.
summary: GlobeCorp's VP Paella Police (Director Armando "Authenticity" Vale) lands in Valencia with a
  scheme to trademark "paella" and sell Instant Paella Powder Kits(TM) in fourteen globally palatable
  flavors. Clara and Gears team up with Abuela Carmen, guardian of the true recipe measured in puñados
  (handfuls), to challenge him to a paella-off per Corporate Policy §12.9. VP's machine produces beige
  discs; Clara's pan reveals golden socarrat. The crowd roars. The trademark falls. VP transfers to Icelandic
  Fermented Shark Optimization.
age_band: 7-9
reading_level:
  target_fk_grade: 3.0
  fk_grade_tolerance: 1.5
  lexile_range: ''
  fountas_pinnell: ''
  max_words_per_page: 150
