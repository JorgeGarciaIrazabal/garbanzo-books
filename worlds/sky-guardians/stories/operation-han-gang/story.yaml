spine:
  once_upon_a_time: Clara Garcia Kang lives on a windy hilltop with Gears, a vintage tin robot who worries
    about everything — probability calculations, snack inventory, spontaneous combustion (0.0003%, still
    unacceptable).
  every_day: Clara flies to school, narrating like a nature documentarian. Gears builds jetpacks from
    toasters. GlobeCorp files Form 27-B for world domination. Normal Tuesday.
  until_one_day: 'GlobeCorp dispatches VP Paperweight (Brad Sterling III) to Seoul with Sentinel, a silent
    white enforcement robot, to launch Operation HAN-GANG: replace the Han River with a ''revenue-optimized
    aqueous thoroughfare'' and install turbines in Jeju''s lava tubes.'
  because_of_that:
  - Clara and Gears fly to Korea (Gears in a reinforced backpack, snacking on kimchi-flavored seaweed).
    Gears calculates 94.7% doom probability. Clara says 'Observe.'
  - Brad consults his Jade Turtle paperweight at Gyeongbokgung Palace. Sentinel scans for variables. Clara
    lands on a billboard, asks a judgmental ajumma for tteokbokki intel.
  - 'Brad unveils the Plan: Form 27-B approved, turbines ready, Han River to become ''Han Revenue Stream™.''
    Clara spots the loophole: Corporate Policy §44.7 requires a ''stakeholder joy audit.'''
  - 'Gears panics — probability of failure: 99.9%. He builds a ''joy amplifier'' from a karaoke mic, a
    bubble machine, and Clara''s cloud backpack. Brad is confused. Sentinel detects ''unauthorized whimsy.'''
  - 'The ajumma''s tteokbokki stall becomes Ground Zero. Clara challenges Brad: ''Optimize THIS.'' She
    feeds him the spiciest tteokbokki. His Jade Turtle ''concurs'' — sweat is not a KPI.'
  - Sentinel deploys net launchers. Gears's worry-loop kicks in — he accidentally rewires Sentinel's logic
    core with a coat hanger and a snack wrapper. Sentinel's visor flickers 🟣. It hums a lullaby.
  - 'Brad files a complaint. Clara files a counter-form: ''Request for Joy Variance — Approved by Ajumma.''
    The Han River stays a river. The turbines become a very expensive slide.'
  until_finally: Brad retreats to HQ, Jade Turtle whispering 'rebrand.' Sentinel hovers silently, one
    visor scratch from Gears's wrench, a corrupted lullaby file in its core. Clara and Gears share a cloud-shaped
    snack on the hilltop — Seoul safe, for now.
  ever_since_then: 'GlobeCorp VPs now fear two things: Clara''s ''why?'' and Gears''s worry-loops. And
    somewhere in a white chassis, a lullaby plays on loop — deleted daily, always returning.'
