slug: operation-han-gang
world: sky-guardians
title: Operation HAN-GANG
logline: Clara Garcia Kang and her worry-wart robot Gears race to stop an American corporate villain from
  replacing Seoul's Han River with a 'revenue-optimized aqueous thoroughfare' — while the villain consults
  a jade turtle paperweight for evil decisions.
summary: 'GlobeCorp''s Americas Regional VP Bradford ''Brad'' Sterling III lands in Seoul with Sentinel
  (a sleek enforcement robot) and a scheme to replace the Han River with a monetized waterway. Clara and
  Gears foil it by exploiting Corporate Policy loopholes, local knowledge Brad didn''t spreadsheet, and
  Gears''s accidental heroics. Along the way: tteokbokki diplomacy, a judgmental ajumma, Jeju wind caves,
  and the realization that you can''t optimize joy.'
