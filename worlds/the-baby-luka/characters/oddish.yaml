name: Oddish
role: sidekick
species: 'Oddish (Pokémon #43, Gen 1 Kanto)'
pronouns: it/they
one_liner: A tiny round blue grass-Pokémon with leaf sprouts on its head — Luka's first real Pokémon friend.
personality:
  traits:
  - gentle
  - curious
  - a little shy
  - loyal
  - playful
  - brave when it counts
  motivation: To find a sunny spot and a friend who understands it — and to nibble good snacks.
  fears:
  - big loud feet
  - being caught by adults
  - dark cold soil
  flaws:
  - slow walker — shuffles on little root-feet
  - easily startled, ducks underground
  - can't reach the high chair
  strengths:
  - kind and loyal
  - knows grass-type moves (Stun Spore, Acid — used only for silly gags)
  - surprising courage when Luka needs help
  quirks:
  - wiggles its leaves when happy
  - hides by ducking its head underground leaving only leaves showing
  - loves dropped Cheerios and berry bits
  - makes a soft 'oddi-oddi' sound
  values:
  - sunshine
  - friendship
  - snacks
  - gentle play
voice:
  speech_style: Soft, earnest, a bit timid. Speaks in short friendly sentences. Calls Luka 'Lu'.
  catchphrases:
  - Oddi-oddi!
  - Lu, look!
  - (scared) duck duck duck!
  vocabulary_level: Simple warm Pokémon-speech (only Luka understands).
