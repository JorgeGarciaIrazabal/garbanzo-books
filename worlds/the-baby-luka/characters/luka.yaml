slug: luka
world: the-baby-luka
name: Luka
role: protagonist
species: human baby
pronouns: he/him
one_liner: A one-year-old who secretly talks to Pokémon and is deeply misunderstood by his loving parents.
personality:
  traits:
  - curious
  - mischevious
  - determined
  - good-humored
  - secretive
  - easily frustrated by baby things
  motivation: To play with his Pokémon friends and be understood — and to avoid broccoli at all costs.
  fears:
  - the broccoli spoon coming at him
  - naptime interrupting a Pokémon adventure
  - Mom finding out about his secret
  flaws:
  - can't walk well yet — pulls himself up and wobbles
  - short attention span
  - limited to baby skills so his schemes backfire hilariously
  strengths:
  - endless imagination
  - brave with Pokémon
  - creative baby-workarounds
  - infectious giggle
  quirks:
  - glances at the camera with a 'don't tell Mom' look
  - points and babbles to cover for a Pokémon
  - treats his rattle like a Pokéball
  - says 'Pika!' which Mom hears as baby babble
  values:
  - friendship
  - play
  - freedom from mashed peas
voice:
  speech_style: Fluent when talking TO Pokémon (full sentences, confident). To adults it comes out as
    'ba ba ga' babble — the comic split. Internally thoughtful and funny.
  catchphrases:
  - Pika-pals!
  - (to adults) ba ba ba!
  - (camera glance) shh.
  vocabulary_level: Fluent Pokémon-talker; baby-babble to grown-ups.
