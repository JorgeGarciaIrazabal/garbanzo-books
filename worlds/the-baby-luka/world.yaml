slug: the-baby-luka
title: The baby Luka
tagline: A one-year-old who chats with Pokémon — if only his parents could understand him.
premise: 'Luka is an ordinary-looking one-year-old with an extraordinary secret: he can understand and
  talk to real Gen 1 (Kanto) Pokémon. While Mom and Dad see a babbling toddler who needs naps and mashed
  peas, Luka is secretly hosting Bulbasaurs in the backyard, trading snacks with Pikachu under the high
  chair, and settling Squirtle turf wars in the bathtub. The comedy lives in the enormous gap between
  his rich Pokémon life and the baffling ''baby things'' his loving, well-meaning parents keep making
  him do.'
