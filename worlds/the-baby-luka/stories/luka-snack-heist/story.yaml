- number: 14
  kind: end
  text: 'In the morning, Mom finds the pantry open.

    The Cheerio box is empty on the floor.

    "Here comes the airplane! Vroom!" Mom says — but there''s nothing to fly.

    Dad shrugs, still yawning.

    Luka eats his mashed peas. Pikachu is full under the chair.

    And Luka looks at the camera.

    "Shh."'
