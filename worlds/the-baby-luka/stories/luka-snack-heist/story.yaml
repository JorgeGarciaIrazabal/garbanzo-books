title: Luka's Great Snack Heist
logline: When Mom hides the Cheerios on the top shelf to stop Luka's 'throwing food' phase, Luka and Pikachu
  assemble a heist crew of backyard Pokémon to pull off the greatest snack rescue in baby history.
summary: 'Luka''s snack supply dries up when Mom, tired of flying Cheerios, puts the box on the highest
  shelf in the pantry. Under the high chair, Pikachu the snack-broker panics — the whole Pokémon snack
  economy is collapsing. Luka and Pikachu recruit Oddish (a distraction), a crafty Squirtle (the climber),
  and a tiny Jigglypuff (the cute decoy) for a baby-scale heist. Every step is a baby-workaround: stacking
  blocks, wobbling on a stool, using a blanket-cape as a rope. Close calls with Mom and Dad pile up. The
  Cheerios are recovered, the snack economy is restored, and no adult ever notices a thing — except the
  mysterious disappearance of every Cheerio in the house.'
