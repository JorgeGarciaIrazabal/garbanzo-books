spine:
  once_upon_a_time: Luka was a one-year-old with a secret Pokémon life and an endless supply of dropped
    Cheerios that kept his Pokémon friends happy.
  every_day: Pikachu ran the snack trade under the high chair — a Cheerio here, a mushed pea there — and
    the backyard Pokémon adored Luka for it.
  until_one_day: Mom decided Luka was throwing too much food and put the Cheerios on the very top shelf
    of the pantry — out of reach for a baby AND a toddler-scale Pikachu.
  because_of_that:
  - The snack economy collapsed. Oddish wouldn't come out from underground. Squirtle sulked in the bathtub.
    Pikachu begged Luka for a plan.
  - Luka assembled a heist crew — Oddish as distraction, Squirtle as climber, Jigglypuff as cute decoy
    — and they staged a wobbly, baby-scale raid on the pantry.
  - Mid-heist, Dad walked in for a midnight snack of his own. The crew froze. Jigglypuff sang. Dad nodded
    off on the kitchen floor.
  until_finally: Luka grabbed the Cheerio box with both chubby hands, toppled backward in a glorious slow-motion
    baby fall, and the box rained snacks across the kitchen — a Cheerio jackpot for every Pokémon.
  ever_since_then: The snack economy was restored, Mom and Dad blamed the missing Cheerios on a pantry
    mishap, and Luka gave the camera his very best 'shh.'
