title: Luka Meets Oddish
logline: A baby who talks to Pokémon befriends a shy Oddish in the backyard — and the two bond over their
  shared, desperate hatred of broccoli.
summary: 'Luka, a one-year-old who secretly talks to real Gen 1 Pokémon, crawls into the backyard and
  meets a shy Oddish hiding in the garden. They''re just becoming friends when Mom calls lunch — and produces
  a bowl of mushy green broccoli. Luka clamps his mouth shut, then has a bright idea: offer the broccoli
  to his new grass-type pal! But Oddish pulls an even bigger gross face — grass Pokémon don''t eat cooked
  broccoli either. Bonded by mutual disgust, the two new friends pull yuck-faces together while Mom, completely
  oblivious, spots only Oddish''s leaves and assumes it''s a weed. Luka babbles cover, the broccoli vanishes
  into the grass, and Mom beams: ''Good boy, you ate it all!'' From then on, every lunch is a secret broccoli-protest
  between best friends.'
