spine:
  once_upon_a_time: Luka was a one-year-old baby with a secret — he could talk to real Pokémon, but his
    parents only heard 'ba ba ba.'
  every_day: Luka played with Pokémon friends in the backyard while Mom fed him mushy baby food he did
    not love.
  until_one_day: Luka met a shy Oddish hiding in the garden — and Mom called him in for lunch with a big
    bowl of broccoli.
  because_of_that:
  - Luka tried to say hello, but Oddish was scared and ducked underground.
  - Mom chased Luka with the broccoli spoon — 'Here comes the airplane!' — and Luka clamped his mouth
    shut.
  - 'Luka had an idea: he offered the broccoli to Oddish. But Oddish pulled an even BIGGER gross face
    — grass Pokémon hate cooked broccoli too!'
  - Mom came out to the yard. Oddish popped underground, leaving only its leaves. Mom saw the leaves and
    said, 'Is that a weed, sweetie?'
  until_finally: 'Luka babbled ''ba ba ba'' to cover, the broccoli was gone in the grass, and Mom beamed:
    ''Good boy, you ate it all!'' — while Luka and Oddish shared a secret gross-face grin. They were best
    friends now.'
  ever_since_then: Every lunch, Mom brings the broccoli. Every lunch, two gross faces pop up — one above
    the table, one in the garden. Best friends hate broccoli together.
