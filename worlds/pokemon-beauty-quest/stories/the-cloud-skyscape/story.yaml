slug: the-cloud-skyscape
world: pokemon-beauty-quest
title: The Cloud Skyscape
logline: Clara and her tiny cloud-fa Lumi float up to the Cloud Skyscape to find a Pokémon whose beauty can be heard — and learn that the most beautiful sound is the one you stop to listen for.
summary: >-
  Clara and her tiny cloud-fa Lumi ride a soft cloud-island high above the
  Flower Meadow, looking for a Pokémon whose beauty is its bell-chime song.
  Along the way they help a lost butterfly home, count three cloud-islands,
  find Lumi's ribbon-pink scarf, ring a bell in tune, and meet Melly, a small
  round sky-fa Pokémon with a soft crystal bell on its tail. Melly is
  beautiful — and so is the path Clara walked to get there.
age_band: 5-7
reading_level:
  target_fk_grade: 1.0
  fk_grade_tolerance: 1.0
  lexile_range: BR100L-300L
  fountas_pinnell: D
  max_words_per_page: 60
  max_sentence_words: 8
  decoding_focus: 'short a (cap, sat, clap, ran, map, nap); short i (sit, hid, tip, big, did); sight: a, the, is, in, it, to, we, and, I, you, said, was, of, on, can, see, here, with, my, me, look, find, do, not, what, did, then, this, that, be, so, no, all, clara, lumi, melly, meadow, butterfly, beautiful, softest, listen, smiles, skyscape, islands, finish, shh'
  decodable: true
themes:
  - seeing beauty in small things
  - listening carefully
  - kindness to shy creatures
  - patience
moral: The most beautiful thing is the one you stop and look — and listen — for.
characters:
  - slug: clara
    stage: base
    role_in_story: protagonist
  - slug: lumi
    stage: base
    role_in_story: companion
spine:
  once_upon_a_time: Clara and her tiny cloud-fa Lumi lived in a sunlit world full of beautiful Pokémon.
  every_day: They looked in the meadow. They looked by the lake. They looked for the most beautiful Pokémon in the world.
  until_one_day: They heard a soft bell-chime in the clouds above the meadow.
  because_of_that:
    - They rode a cloud-island up, up, up to the Cloud Skyscape.
    - They helped a lost butterfly find its way home.
    - They followed the bell sound across three cloud-islands.
    - They found a shy round sky-fa Pokémon with a bell on its tail.
  until_finally: Clara listened, and the shy sky-fa sang the softest bell in the clouds.
  ever_since_then: Clara knew the most beautiful sound was the one she stopped to hear.
