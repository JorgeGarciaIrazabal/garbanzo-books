slug: lumi
world: pokemon-beauty-quest
name: Lumi
role: companion
species: cloud-fa (a tiny fawn-like creature with cloud-glass antlers and a floating cloud tail)
pronouns: they/them
one_liner: A tiny cream-and-peach cloud-fa with mismatched eyes, heart-shaped crystal antlers, and a ribbon-pink scarf who travels everywhere with Clara.
personality:
  traits:
    - gentle
    - curious
    - easily-distracted-by-butterflies
    - brave-when-it-counts
    - sleepy
  motivation: To stay close to Clara, see every beautiful thing, and chase butterflies without falling off any clouds.
  fears:
    - thunder that rumbles too loud
    - Clara walking ahead without them
  flaws:
    - gets distracted and almost falls behind
    - yawns at the worst moment
  strengths:
    - hears soft chime-bells before anyone else
    - always comes back to Clara
    - brave when Clara is scared
  quirks:
    - antlers glow softly when happy and dim when sleepy
    - tail tuff floats a half-inch off the rump and trails a slow curl of sparkle motes
    - 'only sound: a soft "Lumi!"'
  values:
    - friendship
    - wonder
    - kindness
voice:
  speech_style: 'a single soft word: "Lumi!" (with the same warm inflection every time — easy for a 5-year-old to read it as one word)'
  catchphrases:
    - Lumi!
  vocabulary_level: one-word sounds only
appearance:
  age_appearance: tiny, baby-creature, elbow-height to Clara
  build: small, round, soft — fawn-shaped
  height: elbow-height to Clara
  skin: warm cream fur all over
  hair: a soft peach-blush tuft on the forehead between the antlers
  eyes: >-
    MISMATCHED — left eye is sky-lavender #C7BEE8, right eye is peach-light
    #FFD9B5. Both very big, round, dewy, anime-style. This is the
    character's signature.
  outfit: a soft ribbon-pink scarf tied loosely around the neck (#F2A6C2)
  distinguishing_features:
    - mismatched eyes (left lavender, right peach) — the "tell" the kid learns to spot
    - two tiny heart-shaped crystal-cloud antlers (glow when happy, dim when sleepy)
    - a single cloud-tuft tail that floats a half-inch off the rump and trails sparkle motes
    - ribbon-pink scarf (matching Clara's hair bow)
    - two tiny star-shaped cheek freckles (one per cheek)
  color_palette:
