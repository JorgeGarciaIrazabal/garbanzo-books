slug: clara
world: pokemon-beauty-quest
name: Clara
role: protagonist
species: human
pronouns: she/her
one_liner: A bright-eyed, kind young Pokémon trainer who is searching the world for the most beautiful Pokémon — and learns to see beauty in small things along the way.
personality:
  traits:
    - kind
    - curious
    - patient
    - observant
    - hopeful
  motivation: To find the most beautiful Pokémon in the world — but also, simply, to see beauty in every Pokémon she meets.
  fears:
    - missing a beautiful Pokémon that is right in front of her
    - hurting a Pokémon's feelings
  flaws:
    - sometimes looks for the "biggest" beauty and forgets to look at the small ones
    - gets impatient when a clue is hard
  strengths:
    - notices small things others walk past
    - never gives up on a kind question
    - makes every Pokémon feel welcome
  quirks:
    - hums softly when she is looking carefully
    - tilts her head when she hears a bell-like sound
    - keeps a tiny notebook where she draws the Pokémon she meets
  values:
    - kindness
    - curiosity
    - wonder
    - patience
voice:
  speech_style: short, warm, lots of small questions ("Is it here? Did you see it?")
  catchphrases:
    - "I think I see something!"
    - "It is so beautiful."
  vocabulary_level: early-reader simple, concrete, lots of sight words
appearance:
  age_appearance: about seven
  build: small, slim, lightly tanned
  height: child-sized, knee-high to most adult Pokémon trainers
  skin: warm light-tan, sun-kissed
  hair: short chestnut-brown bob, soft bangs across the forehead, slightly wind-tousled
  eyes: big, round, friendly — warm amber-brown
  outfit: >-
    a sunny yellow short-sleeved t-shirt under denim short-overalls with two
    chest pockets, white ankle socks, soft red sneakers, and a small red
    ribbon-pink bow clipped into her hair above her left ear
  distinguishing_features:
    - red ribbon-pink hair bow above her left ear (#F2A6C2)
    - chestnut-brown bob with soft bangs
    - denim short-overalls with two chest pockets
    - a tiny cloth backpack (cream) with a star pin
