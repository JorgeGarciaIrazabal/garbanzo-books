title: Joanie and the Hole
logline: Joanie poops in a magic hole — and the next day it comes back as his new best friend. Then a
  clumsy dragon swallows it by accident.
summary: Joanie loves digging in his magical backyard. One day he really has to go, so he poops in a special
  dark patch of dirt. The next morning, the dirt wiggles and a little blob creature pops out — it's alive!
  Joanie names it Doodle and they become best friends. But that night, a huge clumsy dragon named Gronk
  visits the yard, trips, and accidentally swallows Doodle. Gronk feels terrible and throws Doodle back
  up. Doodle is fine, and now all three are friends!
