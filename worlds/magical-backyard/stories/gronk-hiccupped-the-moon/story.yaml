slug: gronk-hiccupped-the-moon
world: magical-backyard
title: Gronk Hiccupped the Moon
logline: Gronk gets the hiccups and hiccups the MOON right out of the sky — now the backyard is dark and
  Joanie has to get it back up before bedtime.
summary: 'Gronk visits the backyard, eats a spicy comet, and gets the hiccups. One big HIC launches the
  moon out of the sky and it rolls into The Patch. The yard goes dark. Joanie and Doodle try to get it
  back up: they throw it (too heavy), Gronk tries to hiccup it back (hiccups out a shoe instead), and
  a fence post suggests a sneeze. Joanie tickles Gronk''s nose with a feather-grass blade. Gronk sneezes
  the moon back into the sky — but now the sun is coming up. Bedtime? No way. The yard is awake and the
  moon has a face.'
