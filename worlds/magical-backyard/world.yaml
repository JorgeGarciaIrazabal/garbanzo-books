geography:
  overview: A suburban backyard that's secretly alive. The grass whispers gossip. The garden shed is bigger on the inside. The fence posts have faces — and opinions. And the dirt? The dirt remembers everything you put in it.
  locations:
  - name: The Patch
    description: A circle of extra-dark dirt in the middle of the yard where things grow... differently. Anything buried here comes back changed.
    mood: mysterious
    recurring: true
  - name: The Shed
    description: A rickety garden shed that's way bigger inside. Full of weird tools, talking plants, and a ladder that goes somewhere it shouldn't.
    mood: chaotic
    recurring: true
  - name: The Fence
    description: A wooden fence whose posts have carved faces. They gossip, argue, and give terrible advice.
    mood: nosy
    recurring: true
  - name: The Compost Heap
    description: A steaming pile that occasionally burps and once spat out a fully-formed opinion about the weather.
    mood: gross
    recurring: false
rules:
- id: dirt-remembers
  text: Anything buried in The Patch comes back the next day — alive, friendly, and slightly different from what you put in.
- id: night-awakening
  text: At night, the backyard wakes up. Plants walk around. The fence posts argue louder. Things that were buried start looking for their bury-er.
- id: dragon-visits
  text: A huge, clumsy dragon visits the backyard at night. It has terrible aim and a habit of throwing things up — but it means well.
