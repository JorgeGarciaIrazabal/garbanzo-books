slug: magical-backyard
title: The Magical Backyard
tagline: A perfectly ordinary backyard — except nothing in it is ordinary.
premise: 'Hunter''s backyard looks normal: a patch of grass, a fence, a garden shed. But the dirt has opinions, the plants throw parties at midnight, and anything you bury might just come back as your best friend. Gross, hilarious, and a little bit dangerous — the kind of place where a kid can dig a hole and change their life.'
tone:
- madcap
- mischievous
- gross-out-funny
- surprising
- a-little-wild
genres:
