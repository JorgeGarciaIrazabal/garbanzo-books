name: Joanie
role: protagonist
species: human
pronouns: he/him
one_liner: An 8-year-old boy who digs holes and isn't afraid of anything gross — in fact, he kind of loves
  it.
personality:
  traits:
  - mischievous
  - fearless
  - grossness-enthusiast
  - loyal
  - impulsive
  motivation: To discover what happens when you dig deep enough — and to make the weirdest friends possible.
  fears:
  - being bored
  - vegetables that talk back
  flaws:
  - digs first, thinks later
  - cannot resist a mysterious hole
  - laughs at the worst possible moments
  strengths:
  - brave when things get weird
  - never gives up on a friend — even a gross one
  - incredible digging stamina
  quirks:
  - carries a trowel everywhere
  - names everything he digs up
  - talks to dirt like it's a pet
  values:
  - friendship
  - curiosity
  - glorious messes
voice:
  speech_style: loud, excited, full of gross-out enthusiasm — says 'WHOAAA' and 'GROSSSS' a lot, but always
    in a delighted way
  catchphrases:
