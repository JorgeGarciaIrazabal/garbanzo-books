name: Deploy storybooks to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Quality gate — runs on every push AND pull request. The build/deploy below depend
  # on it, so a lint error, a failing test, or invalid content can never reach Pages.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync environment (with dev tooling)
        run: uv sync
      - name: Lint
        run: uv run ruff check scripts
      - name: Type-check
        run: uv run mypy
      - name: Backend tests
        run: uv run python -m pytest tests/backend/ -q
      - name: Frontend tests
        working-directory: tests/frontend
        run: |
          npm install --no-fund --no-audit
          npx vitest run
      - name: Validate all books
        run: uv run python scripts/validate.py

  build:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --no-dev
      - name: Build site
        run: uv run python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
